<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vinyl — app preview</title>
    <!--
      Runs the REAL frontend (src/index.html + main.js + label.js) against a
      stubbed Tauri bridge, so the widget can be iterated without a Rust
      rebuild. Not shipped; a development harness only.

      Needs a local server, because it fetches and imports:
        python -m http.server 8731
        http://127.0.0.1:8731/design/app-preview.html

      Query flags:
        ?state=playing | paused | none | live | art | video
        ?art=red | teal | indigo | amber
        ?size=full | compact
        ?theme=auto | light | dark
        ?pos=<seconds>   start position, for checking the lyric scroll
        ?lyrics=off      stands in for the menu's Show lyrics being unticked
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(1100px 640px at 40% 24%, #1d2026 0%, #0a0b0d 70%);
      }
      /* Both mirror prefs.rs Size::dimensions(). The padding stands in for the
         real body's shadow gutter: the harness injects the widget into #shell
         rather than into <body>, so without it the chassis measures 32px wider
         here than it does in the app. */
      #shell {
        padding: 16px;
        width: 460px;
        height: 273px;
        resize: both;
        overflow: hidden;
      }
      #shell.compact {
        width: 280px;
        height: 275px;
      }
    </style>
  </head>

  <body>
    <div id="shell"></div>

    <script>
      /* Stand-in album art, drawn here rather than sourced. `?art=` picks one,
         so the screen tint can be checked against covers of different hues. */
      const ART_HUES = { red: "#a8232c", teal: "#12776f", indigo: "#2f3d8f", amber: "#c8861a" };
      const artName = new URLSearchParams(location.search).get("art") || "red";
      const artColour = ART_HUES[artName] || ART_HUES.red;

      const FAKE_ART =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
             <rect width="200" height="200" fill="${artColour}"/>
             <circle cx="70" cy="68" r="38" fill="#f2efe9" opacity="0.9"/>
             <rect x="38" y="130" width="122" height="9" fill="#f2efe9" opacity="0.75"/>
             <rect x="38" y="150" width="72" height="9" fill="#f2efe9" opacity="0.45"/>
           </svg>`,
        );

      const flavour = new URLSearchParams(location.search).get("state") || "playing";

      /* Real stamps, taken from what LRCLIB returns for this track, so the
         scroll is exercised against the spacing it will actually meet. */
      const ALONE_AGAIN = {
        trackKey: "The Weeknd|Alone Again",
        instrumental: false,
        lines: [
          { atMs: 0, text: "" },
          { atMs: 11550, text: "Take off my disguise" },
          { atMs: 17460, text: "I'm living someone else's life" },
          { atMs: 23290, text: "Suppressing who I was inside" },
          { atMs: 28540, text: "So I throw two-thousand ones in the sky" },
          { atMs: 35160, text: "Together we're alone (together we're alone)" },
          { atMs: 41590, text: "In Vegas I feel so at home" },
          { atMs: 48120, text: "Falling only for the night" },
          { atMs: 54300, text: "So I throw two-thousand ones in the sky" },
          { atMs: 61000, text: "How much to light up my star again" },
          { atMs: 67400, text: "And rewire all my thoughts?" },
          { atMs: 73800, text: "Oh baby, won't you remind me what I am?" },
          { atMs: 80200, text: "And break my little cold heart" },
        ],
      };

      /* Per state: a track with words, a track without, and none at all. */
      const LYRICS = {
        playing: ALONE_AGAIN,
        art: ALONE_AGAIN,
        paused: ALONE_AGAIN,
        // A film, a podcast or simply a track nobody has transcribed.
        video: { trackKey: "", lines: [], instrumental: false },
        live: { trackKey: "", lines: [], instrumental: false },
        none: { trackKey: "", lines: [], instrumental: false },
      };

      const BASE = {
        title: "Alone Again",
        artist: "The Weeknd",
        album: "After Hours (Deluxe)",
        artId: null,
        status: "playing",
        positionMs: Number(new URLSearchParams(location.search).get("pos") ?? 96) * 1000,
        durationMs: 250_000,
        updatedAt: Date.now(),
        sourceApp: "AppleMusic.exe",
        mediaKind: "music",
        peak: 0.0,
        canPlayPause: true,
        canNext: true,
        canPrevious: true,
        canShuffle: true,
        canRepeat: true,
        shuffle: false,
        repeat: "off",
      };

      const FLAVOURS = {
        playing: BASE,
        paused: { ...BASE, status: "paused" },
        art: { ...BASE, artId: "fake" },
        // A livestream typically offers no skip, which must dim the buttons
        // rather than leave dead ones enabled.
        live: {
          ...BASE,
          durationMs: null,
          positionMs: 0,
          title: "Lofi radio",
          canNext: false,
          canPrevious: false,
        },
        // Not music: the screen must fall back to title and artist alone.
        video: {
          ...BASE,
          title: "Some Documentary",
          artist: "YouTube",
          album: null,
          mediaKind: "video",
          sourceApp: "msedge.exe",
        },
        none: {
          title: null,
          artist: null,
          album: null,
          artId: null,
          status: "noSession",
          positionMs: null,
          durationMs: null,
          updatedAt: 0,
          sourceApp: "",
          mediaKind: "unknown",
          peak: 0,
          canPlayPause: false,
          canNext: false,
          canPrevious: false,
          canShuffle: false,
          canRepeat: false,
          shuffle: false,
          repeat: "off",
        },
      };

      // ?size= stands in for the saved config the real build reads from Rust.
      const sizeFlag =
        new URLSearchParams(location.search).get("size") === "compact"
          ? "compact"
          : "full";
      // ?theme= stands in for the context-menu choice. Default auto, which
      // resolves against whatever colour scheme the browser reports.
      const themeFlag = new URLSearchParams(location.search).get("theme") || "auto";
      const lyricsOff = new URLSearchParams(location.search).get("lyrics") === "off";

      window.__TAURI__ = {
        core: {
          invoke: async (cmd, args) => {
            if (cmd === "get_state") return FLAVOURS[flavour] ?? BASE;
            if (cmd === "get_prefs") return { size: sizeFlag, theme: themeFlag, lyrics: !lyricsOff };
            // Mirrors the real initial read. The event still fires afterwards,
            // which is also what the real build does on a track change.
            if (cmd === "get_lyrics")
              return lyricsOff
                ? { trackKey: "", lines: [], instrumental: false }
                : (LYRICS[flavour] ?? { trackKey: "", lines: [], instrumental: false });
            if (cmd === "show_menu") {
              console.log("show_menu");
              return null;
            }
            if (cmd === "transport") {
              console.log("transport:", args.action);
              return null;
            }
            throw new Error(`unstubbed command: ${cmd}`);
          },
          // The real one returns http://art.localhost/{id}; any URL will do here.
          convertFileSrc: () => FAKE_ART,
        },
        // Real dragging needs a real window; the harness just records the call.
        window: {
          getCurrentWindow: () => ({
            startDragging: async () => {
              console.log("startDragging");
            },
          }),
        },
        event: {
          // Only lyrics-changed carries anything here; the rest are one-shot in
          // the harness because get_state and get_prefs already returned.
          listen: async (name, handler) => {
            if (!lyricsOff && name === "lyrics-changed" && LYRICS[flavour] !== undefined) {
              // Deferred so main.js has finished booting, which is also the
              // order the real build sees: state first, words a moment later.
              setTimeout(() => handler({ payload: LYRICS[flavour] }), 300);
            }
            return () => {};
          },
        },
      };
    </script>

    <script type="module">
      const markup = await (await fetch("../src/index.html")).text();
      const parsed = new DOMParser().parseFromString(markup, "text/html");

      const styles = document.createElement("link");
      styles.rel = "stylesheet";
      styles.href = "../src/styles.css";
      document.head.appendChild(styles);

      const shell = document.getElementById("shell");
      shell.innerHTML = parsed.body.innerHTML;

      // index.html does this in a <head> script, which injecting body.innerHTML
      // skips. main.js overwrites it a moment later from the stubbed get_prefs.
      document.documentElement.dataset.theme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";

      // Rust resizes the real window; here the harness resizes its own shell.
      if (sizeFlag === "compact") shell.classList.add("compact");

      await import("../src/main.js");
    </script>
  </body>
</html>
