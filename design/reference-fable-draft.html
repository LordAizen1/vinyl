<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl — desktop widget</title>
<!--
  ─────────────────────────────────────────────────────────────
  VINYL · a 2D turntable widget for Windows desktop shells
  ─────────────────────────────────────────────────────────────
  · Single self-contained file: HTML + CSS + vanilla JS, no assets.
  · The widget root (.vinyl-widget) fills its parent container and
    adapts via container queries from ~320×180 up to ~520×280.
  · To embed: copy the <style>, the .vinyl-widget subtree and the
    <script> into your webview shell. A tiny API is exposed on
    window.VinylWidget { setQueue, load, play, pause, toggle, next, prev }.
  · The demo shell below (.stage) is resizable — drag its corner.
  ─────────────────────────────────────────────────────────────
-->
<style>
/* ═══════════════ 1 · TOKENS ═══════════════ */
:root{
  --bg-hi:#1d1f22;          /* plinth top light   */
  --bg-lo:#121316;          /* plinth bottom      */
  --ink:#e9e7e1;            /* warm off-white     */
  --muted:#96938a;          /* secondary text     */
  --faint:#63615b;
  --line:rgba(255,255,255,.085);
  --accent:#d8a250;         /* muted amber — the single accent */
  --accent-soft:rgba(216,162,80,.55);
  --vinyl:#0b0b0d;
  --radius:14px;
  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}

/* ═══════════════ 2 · DEMO SHELL (not part of the widget) ═══════════════ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:grid; place-items:center; gap:0;
  background:radial-gradient(1100px 640px at 50% 26%, #17191c 0%, #0a0b0d 70%);
  font-family:var(--f-ui); color:var(--ink);
}
.stage-wrap{display:grid; justify-items:center; gap:12px}
.stage{
  width:420px; height:220px;
  min-width:320px; min-height:180px; max-width:560px; max-height:300px;
  resize:both; overflow:hidden; border-radius:var(--radius);
}
.hint{font-size:11px; color:var(--faint); letter-spacing:.02em; user-select:none}

/* ═══════════════ 3 · WIDGET ROOT ═══════════════ */
.vinyl-widget{
  container:vinylw / size;
  position:relative; width:100%; height:100%;
  display:flex; align-items:stretch;
  border-radius:var(--radius);
  background:linear-gradient(178deg, var(--bg-hi) 0%, #17181b 46%, var(--bg-lo) 100%);
  border:1px solid rgba(255,255,255,.075);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.055),
    0 22px 44px -20px rgba(0,0,0,.7),
    0 5px 14px rgba(0,0,0,.38);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
/* faint machined-surface grain */
.vinyl-widget::before{
  content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
  opacity:.045; mix-blend-mode:overlay;
}

/* ═══════════════ 4 · DECK (left, the hero) ═══════════════ */
.deck{
  flex:none; height:100%; aspect-ratio:232/220; max-width:56%;
  position:relative;
}
.deck svg{width:100%; height:100%; display:block}
#deckHit{cursor:pointer}
#armG,#armBase,#armRest,#vinylG{pointer-events:none}

/* record drops onto the platter when loaded */
#vinylG{
  opacity:0; transform:scale(.962);
  transform-box:view-box; transform-origin:96px 112px;
  transition:opacity .5s ease, transform .62s cubic-bezier(.2,.75,.22,1);
}
.vinyl-widget.loaded #vinylG{opacity:1; transform:scale(1)}
#labelG{transition:opacity .26s ease}

/* ═══════════════ 5 · PANEL (right) ═══════════════ */
.panel{
  flex:1; min-width:0;
  display:flex; flex-direction:column;
  padding:12px 16px 13px 6px;
}
.flex{flex:1}

/* — eyebrow: lamp · wordmark · speed — */
.eyebrow{display:flex; align-items:center; gap:8px; min-height:16px}
.lamp{
  width:6px; height:6px; border-radius:50%;
  background:#37393d; box-shadow:inset 0 1px 1px rgba(0,0,0,.7);
  transition:background .35s, box-shadow .35s;
}
.vinyl-widget.loaded .lamp{background:rgba(216,162,80,.42)}
.vinyl-widget.playing .lamp{
  background:var(--accent);
  box-shadow:0 0 7px 1.5px rgba(216,162,80,.4);
  animation:lampPulse 3.2s ease-in-out infinite;
}
@keyframes lampPulse{
  0%,100%{opacity:1; box-shadow:0 0 7px 1.5px rgba(216,162,80,.4)}
  50%    {opacity:.72; box-shadow:0 0 4px .5px rgba(216,162,80,.22)}
}
.brand{
  font-size:9px; font-weight:600; letter-spacing:.22em;
  color:var(--faint); transform:translateY(.5px);
}
.seg{
  display:flex; gap:2px; padding:2px;
  background:rgba(255,255,255,.05); border-radius:6px;
}
.segb{
  appearance:none; border:0; margin:0; cursor:pointer;
  font:600 8.5px/1 var(--f-ui); letter-spacing:.05em;
  color:var(--faint); background:transparent;
  padding:3px 6px; border-radius:4px;
  transition:color .15s, background .15s;
}
.segb:hover{color:var(--muted)}
.segb.on{background:rgba(255,255,255,.10); color:#d8d5cd}

/* — track block, anchored to lower half — */
.track{margin-top:auto; min-width:0}
.title-wrap{overflow:hidden; white-space:nowrap}
.title-wrap.of{
  -webkit-mask-image:linear-gradient(90deg,#000 0 86%,transparent);
          mask-image:linear-gradient(90deg,#000 0 86%,transparent);
}
.title{
  display:inline-block; max-width:none;
  font-size:15.5px; font-weight:600; letter-spacing:-.01em; color:var(--ink);
  transform:translateX(0);
  transition:transform var(--scrollDur,4s) linear;
}
.title-wrap.of:hover .title,
.title-wrap.of:focus-within .title{transform:translateX(var(--shift,0px))}
.artist{
  margin-top:3px; font-size:11.5px; color:var(--muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* — progress — */
.progress{margin-top:10px}
#seek{
  -webkit-appearance:none; appearance:none;
  width:100%; height:16px; margin:0; background:transparent; cursor:pointer;
}
#seek:disabled{cursor:default; opacity:.45}
#seek::-webkit-slider-runnable-track{
  height:3px; border-radius:2px;
  background:linear-gradient(90deg, var(--accent) var(--p,0%), rgba(255,255,255,.13) var(--p,0%));
}
#seek::-webkit-slider-thumb{
  -webkit-appearance:none; width:9px; height:9px; border-radius:50%;
  background:#ece9e2; margin-top:-3px;
  box-shadow:0 1px 3px rgba(0,0,0,.6);
  opacity:0; transform:scale(.8);
  transition:opacity .16s, transform .16s;
}
#seek:hover::-webkit-slider-thumb,
#seek:focus-visible::-webkit-slider-thumb{opacity:1; transform:scale(1)}
#seek::-moz-range-track{height:3px; border-radius:2px; background:rgba(255,255,255,.13)}
#seek::-moz-range-progress{height:3px; border-radius:2px; background:var(--accent)}
#seek::-moz-range-thumb{
  width:9px; height:9px; border:0; border-radius:50%; background:#ece9e2;
}
.times{
  display:flex; justify-content:space-between;
  margin-top:2px; font-size:10.5px; color:var(--faint);
  font-variant-numeric:tabular-nums; letter-spacing:.03em;
}

/* — transport + volume — */
.controls{display:flex; align-items:center; gap:8px; margin-top:7px}
.tbtn{
  appearance:none; border:1px solid transparent; margin:0; padding:0;
  width:28px; height:28px; border-radius:50%;
  display:grid; place-items:center;
  background:transparent; color:#cfccc4; cursor:pointer;
  transition:background .15s, color .15s, border-color .15s, transform .1s;
}
.tbtn:hover{background:rgba(255,255,255,.07); color:var(--ink)}
.tbtn:active{transform:scale(.93)}
.tbtn.play{
  width:37px; height:37px;
  border:1px solid rgba(255,255,255,.16); color:var(--ink);
  background:radial-gradient(circle at 34% 28%, #2c2e33, #1c1e22);
  box-shadow:0 2px 6px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.07);
}
.tbtn.play:hover{border-color:var(--accent-soft); color:#f2ecdf}
.tbtn.play:active{transform:scale(.96)}
.tbtn svg{grid-area:1/1}
#icPlay{margin-left:1px; transition:opacity .16s, transform .16s}
#icPause{opacity:0; transform:scale(.7); transition:opacity .16s, transform .16s}
.vinyl-widget.playing #icPlay{opacity:0; transform:scale(.7)}
.vinyl-widget.playing #icPause{opacity:1; transform:scale(1)}
.dim{opacity:.35; pointer-events:none}

/* volume knob */
.knob{
  width:30px; height:30px; border-radius:50%; position:relative;
  background:
    radial-gradient(circle at 35% 28%, rgba(255,255,255,.10), transparent 56%),
    repeating-conic-gradient(from 8deg, #26282c 0deg 7deg, #1e2024 7deg 14deg);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 2px 5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  cursor:grab; touch-action:none;
  transition:border-color .15s;
}
.knob:hover{border-color:rgba(255,255,255,.24)}
.knob:active{cursor:grabbing}
.knob-face{
  position:absolute; inset:0;
  transform:rotate(var(--rot,54deg));
  transition:transform .12s ease-out;
}
.knob-dot{
  position:absolute; left:50%; top:3.5px;
  width:3px; height:3px; margin-left:-1.5px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 4px rgba(216,162,80,.5);
}

/* focus — keyboard only */
:where(button,[role="slider"],input):focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
#seek:focus-visible{outline-offset:5px; border-radius:4px}

/* ═══════════════ 6 · RESPONSIVE (container queries) ═══════════════ */
@container vinylw (max-width:378px){
  .brand{display:none}
  .panel{padding-right:14px}
}
@container vinylw (max-width:352px){
  .seg{display:none}
  .knob{display:none}
  .deck{max-width:52%}
  .title{font-size:14px}
}
@container vinylw (max-height:198px){
  .panel{padding-top:9px; padding-bottom:10px}
  .title{font-size:14px}
  .artist{margin-top:2px; font-size:11px}
  .progress{margin-top:7px}
  .controls{margin-top:5px}
  .tbtn{width:26px; height:26px}
  .tbtn.play{width:33px; height:33px}
}

/* ═══════════════ 7 · REDUCED MOTION ═══════════════ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition-duration:.01ms !important;
    animation:none !important;
  }
}
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage">

    <!-- ══════════ WIDGET ══════════ -->
    <div class="vinyl-widget idle" id="widget" role="group" aria-label="Vinyl record player">

      <!-- ─── deck ─── -->
      <div class="deck">
        <svg viewBox="0 0 232 220" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <radialGradient id="gPlatter" cx="50%" cy="40%" r="65%">
              <stop offset="0"   stop-color="#35373c"/>
              <stop offset=".72" stop-color="#232529"/>
              <stop offset="1"   stop-color="#191b1e"/>
            </radialGradient>
            <linearGradient id="gTube" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0"   stop-color="#63666d"/>
              <stop offset=".38" stop-color="#b7bbc2"/>
              <stop offset=".58" stop-color="#8d9198"/>
              <stop offset="1"   stop-color="#4f5258"/>
            </linearGradient>
            <radialGradient id="gCap" cx="36%" cy="30%" r="78%">
              <stop offset="0"   stop-color="#b9bdc3"/>
              <stop offset=".55" stop-color="#7c8087"/>
              <stop offset="1"   stop-color="#4b4e54"/>
            </radialGradient>
            <radialGradient id="gCw" cx="38%" cy="30%" r="80%">
              <stop offset="0"   stop-color="#8e939a"/>
              <stop offset=".6"  stop-color="#5b5f66"/>
              <stop offset="1"   stop-color="#393c41"/>
            </radialGradient>
            <radialGradient id="gLabShade" cx="42%" cy="34%" r="72%">
              <stop offset="0"   stop-color="rgba(255,255,255,.12)"/>
              <stop offset=".45" stop-color="rgba(255,255,255,0)"/>
              <stop offset="1"   stop-color="rgba(0,0,0,.20)"/>
            </radialGradient>
            <filter id="fB7" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="7"/>
            </filter>
            <filter id="fB5" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="5"/>
            </filter>
            <filter id="fB2" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="1.4"/>
            </filter>
            <mask id="mV">
              <rect x="0" y="0" width="232" height="220" fill="#000"/>
              <circle cx="96" cy="112" r="72" fill="#fff"/>
            </mask>
            <clipPath id="cLab"><circle cx="96" cy="112" r="26"/></clipPath>
          </defs>

          <!-- platter well + platter -->
          <circle cx="96" cy="117" r="86" fill="#000" opacity=".5" filter="url(#fB5)"/>
          <circle cx="96" cy="112" r="88" fill="#0c0d0f"/>
          <circle cx="96" cy="112" r="88" fill="none" stroke="rgba(255,255,255,.045)" stroke-width="1"/>
          <circle cx="96" cy="112" r="84" fill="url(#gPlatter)" stroke="#2c2e32" stroke-width="1"/>
          <circle cx="96" cy="112" r="84" fill="none" stroke="rgba(255,255,255,.10)" stroke-width=".8"
                  stroke-dasharray="132 396" transform="rotate(198 96 112)"/>
          <!-- strobe dots on the platter rim -->
          <circle cx="96" cy="112" r="80" fill="none" stroke="#b9bdc3" opacity=".26"
                  stroke-width="1.6" stroke-dasharray="1 3.4"/>
          <!-- rubber mat (visible when no record is loaded) -->
          <circle cx="96" cy="112" r="76" fill="#101214"/>
          <g fill="none" stroke="rgba(255,255,255,.035)" stroke-width=".7">
            <circle cx="96" cy="112" r="22"/><circle cx="96" cy="112" r="32"/>
            <circle cx="96" cy="112" r="42"/><circle cx="96" cy="112" r="52"/>
            <circle cx="96" cy="112" r="62"/><circle cx="96" cy="112" r="70"/>
          </g>
          <circle cx="96" cy="112" r="3.2" fill="#08090a"/>

          <!-- ─── the record ─── -->
          <g id="vinylG">
            <g id="spinG" transform="rotate(0 96 112)">
              <circle cx="96" cy="112" r="72" fill="#0b0b0d"/>
              <circle cx="96" cy="112" r="72" fill="none" stroke="#000" stroke-width="1"/>
              <g id="grooves" fill="none"></g>
              <g id="labelG">
                <circle id="labBase" cx="96" cy="112" r="26" fill="#c89a52"/>
                <image id="labArt" x="70" y="86" width="52" height="52"
                       clip-path="url(#cLab)" preserveAspectRatio="xMidYMid slice"
                       style="display:none" opacity=".9"/>
                <circle cx="96" cy="112" r="26" fill="url(#gLabShade)"/>
                <circle id="labR1" cx="96" cy="112" r="23.5" fill="none" stroke="#2a2113" stroke-width=".5" opacity=".55"/>
                <circle id="labR2" cx="96" cy="112" r="4.6"  fill="none" stroke="#2a2113" stroke-width=".45" opacity=".6"/>
                <text id="labT1" x="96" y="104" text-anchor="middle"
                      font-family="Georgia, 'Times New Roman', serif" font-size="4.8"
                      font-weight="600" letter-spacing=".7" fill="#2a2113">SIDE A</text>
                <text id="labT2" x="96" y="123.5" text-anchor="middle"
                      font-family="Georgia, 'Times New Roman', serif" font-size="3.4"
                      letter-spacing=".45" fill="#2a2113" opacity=".85">33⅓ RPM · LONG PLAY</text>
                <circle cx="96" cy="112" r="2.6" fill="#0b0c0d"/>
                <circle cx="96" cy="112" r="2.6" fill="none" stroke="rgba(0,0,0,.55)" stroke-width=".4"/>
              </g>
            </g>
            <!-- fixed-light sheen: the grooves rotate beneath it -->
            <g mask="url(#mV)" pointer-events="none">
              <path d="M96 112 L14 4 L138 -18 Z"   fill="#fff" opacity=".075" filter="url(#fB7)"/>
              <path d="M96 112 L186 218 L96 236 Z" fill="#fff" opacity=".045" filter="url(#fB7)"/>
            </g>
            <circle cx="96" cy="112" r="71.3" fill="none" stroke="#fff" opacity=".14"
                    stroke-width=".8" stroke-dasharray="118 330" transform="rotate(196 96 112)"/>
            <circle cx="96" cy="112" r="2.2" fill="url(#gCap)" stroke="rgba(0,0,0,.6)" stroke-width=".4"/>
          </g>

          <!-- click target: tap the platter to play / pause -->
          <circle id="deckHit" cx="96" cy="112" r="86" fill="rgba(0,0,0,0)"/>

          <!-- ─── tonearm ─── -->
          <g id="armRest">
            <ellipse cx="198" cy="122.5" rx="6.5" ry="2" fill="#000" opacity=".4" filter="url(#fB2)"/>
            <rect x="193.2" y="117.4" width="9.6" height="5.2" rx="2.4"
                  fill="#17181b" stroke="rgba(255,255,255,.10)" stroke-width=".6"/>
          </g>
          <g id="armBase">
            <circle cx="198" cy="42" r="13.5" fill="#202226" stroke="#2e3034" stroke-width="1"/>
            <circle cx="198" cy="42" r="13.5" fill="none" stroke="rgba(255,255,255,.09)"
                    stroke-width=".8" stroke-dasharray="26 60" transform="rotate(210 198 42)"/>
          </g>
          <g id="armG" transform="rotate(0 198 42)">
            <!-- counterweight -->
            <circle cx="198" cy="23.5" r="7" fill="url(#gCw)" stroke="#202226" stroke-width=".8"/>
            <path d="M192.4 21.6 H203.6 M192 23.5 H204 M192.4 25.4 H203.6"
                  stroke="rgba(0,0,0,.35)" stroke-width=".7"/>
            <rect x="196.9" y="29" width="2.2" height="8" fill="#6f737a"/>
            <!-- bearing cap -->
            <circle cx="198" cy="42" r="6" fill="url(#gCap)" stroke="#222428" stroke-width=".8"/>
            <circle cx="198" cy="42" r="1" fill="#33363b"/>
            <!-- tube -->
            <line x1="198" y1="47" x2="198" y2="125" stroke="rgba(0,0,0,.35)" stroke-width="5.6" stroke-linecap="round"/>
            <line x1="198" y1="47" x2="198" y2="125" stroke="url(#gTube)" stroke-width="4.2" stroke-linecap="round"/>
            <line x1="197.1" y1="49" x2="197.1" y2="123" stroke="rgba(255,255,255,.5)" stroke-width=".7"
                  stroke-linecap="round" opacity=".5"/>
            <!-- headshell + cartridge + stylus -->
            <path d="M194.4 123.5 h7.2 l1.1 12.6 a3.1 3.1 0 0 1 -3.1 3.4 h-3.4 a3.1 3.1 0 0 1 -3.1 -3.4 Z"
                  fill="#292b30" stroke="#17181a" stroke-width=".8"/>
            <rect x="195.7" y="131.5" width="4.6" height="6.4" rx="1" fill="#17181b"/>
            <path d="M197.1 138.2 l.9 3.6 .9 -3.6 Z" fill="#d9dce1"/>
            <path d="M201.8 126.5 q4.4 1.4 4.6 5.6" stroke="#9aa0a8" stroke-width="1"
                  fill="none" stroke-linecap="round"/>
            <ellipse id="needleSh" cx="197.9" cy="143.4" rx="3.4" ry="1" fill="#000" opacity="0" filter="url(#fB2)"/>
          </g>
        </svg>
      </div>

      <!-- ─── panel ─── -->
      <div class="panel">
        <div class="eyebrow">
          <span class="lamp" aria-hidden="true"></span>
          <span class="brand">PHONO</span>
          <span class="flex"></span>
          <div class="seg" role="radiogroup" aria-label="Platter speed">
            <button id="seg33" class="segb on" role="radio" aria-checked="true" title="33⅓ RPM">33⅓</button>
            <button id="seg45" class="segb" role="radio" aria-checked="false" title="45 RPM">45</button>
          </div>
        </div>

        <div class="track" aria-live="polite">
          <div class="title-wrap" id="titleWrap"><span class="title" id="tTitle">Nothing on the platter</span></div>
          <div class="artist" id="tArtist">Press play to drop a record</div>
        </div>

        <div class="progress">
          <input id="seek" type="range" min="0" max="1000" step="2" value="0" aria-label="Seek" disabled>
          <div class="times"><span id="tEl">0:00</span><span id="tTot">–:––</span></div>
        </div>

        <div class="controls">
          <button id="btnPrev" class="tbtn dim" aria-label="Previous track">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
              <path d="M6.2 5.2h2.3v13.6H6.2zM18.9 6.1v11.8c0 .95-1.05 1.52-1.85.98l-8.6-5.9a1.18 1.18 0 0 1 0-1.96l8.6-5.9c.8-.54 1.85.03 1.85.98z"/>
            </svg>
          </button>
          <button id="btnPlay" class="tbtn play" aria-label="Play">
            <svg id="icPlay" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M8.6 5.5v13c0 .96 1.06 1.54 1.86 1.02l10-6.5c.74-.48.74-1.56 0-2.04l-10-6.5C9.66 3.96 8.6 4.54 8.6 5.5z"/>
            </svg>
            <svg id="icPause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M7.4 5h3.1v14H7.4zM13.5 5h3.1v14h-3.1z"/>
            </svg>
          </button>
          <button id="btnNext" class="tbtn dim" aria-label="Next track">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
              <path d="M15.5 5.2h2.3v13.6h-2.3zM5.1 6.1v11.8c0 .95 1.05 1.52 1.85.98l8.6-5.9c.78-.53.78-1.43 0-1.96l-8.6-5.9C6.15 4.58 5.1 5.15 5.1 6.1z"/>
            </svg>
          </button>
          <span class="flex"></span>
          <div class="knob" id="knob" role="slider" tabindex="0"
               aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"
               aria-orientation="vertical" title="Volume 70%">
            <div class="knob-face" id="knobFace"><span class="knob-dot"></span></div>
          </div>
        </div>
      </div>
    </div>
    <!-- ══════════ /WIDGET ══════════ -->

  </div>
  <div class="hint">drag the corner to resize · 320×180 – 560×300</div>
</div>

<script>
(() => {
"use strict";

/* ═══════════════ dom ═══════════════ */
const $ = s => document.querySelector(s);
const widget = $("#widget");
const spinG = $("#spinG"), armG = $("#armG"), grooves = $("#grooves");
const needleSh = $("#needleSh");
const labBase = $("#labBase"), labR1 = $("#labR1"), labR2 = $("#labR2");
const labT1 = $("#labT1"), labT2 = $("#labT2"), labArt = $("#labArt"), labelG = $("#labelG");
const tTitle = $("#tTitle"), tArtist = $("#tArtist"), titleWrap = $("#titleWrap");
const tEl = $("#tEl"), tTot = $("#tTot"), seek = $("#seek");
const btnPrev = $("#btnPrev"), btnPlay = $("#btnPlay"), btnNext = $("#btnNext");
const knob = $("#knob"), knobFace = $("#knobFace");
const seg33 = $("#seg33"), seg45 = $("#seg45");
const deckHit = $("#deckHit");
const NS = "http://www.w3.org/2000/svg";
const RM = matchMedia("(prefers-reduced-motion: reduce)");

/* ═══════════════ data ═══════════════ */
/* Each track may also carry an `art` URL — it is clipped onto the record
   label at reduced opacity, keeping the vinyl metaphor dominant. */
const QUEUE = [
  { t:"Amber Down",                         a:"Halcyon Motel",  d:227, lab:"#c89a52", ink:"#2a2113" },
  { t:"Sea of Tin and Other Small Mercies", a:"The Cordelays",  d:252, lab:"#ded7c6", ink:"#3a362b" },
  { t:"Low Light",                          a:"Vera Lane Trio", d:178, lab:"#7f4038", ink:"#f2e3d6" },
];

/* ═══════════════ geometry & physics constants ═══════════════
   Platter centre (96,112) · arm pivot (198,42) · arm length 100.
   The engagement angles come from intersecting the stylus arc with
   the groove radii, so the arm genuinely tracks the playhead:      */
const ARM = { REST: 0, OUT: 21.1, IN: 40.2, LIFT: -2.4 };
const SPEED = { 33: 200, 45: 270 };          /* deg/s ≈ 33⅓ & 45 RPM */

const state = {
  idx: -1, playing: false, elapsed: 0,
  vol: 0.7, rpm: 33, seeking: false,
  angle: 0, omega: 0, arm: 0, needle: 0,
};

/* ═══════════════ grooves (generated, vector-clean) ═══════════════ */
function ring(r, op, sw){
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", 96); c.setAttribute("cy", 112); c.setAttribute("r", r);
  c.setAttribute("stroke", "#fff"); c.setAttribute("stroke-width", sw);
  c.setAttribute("opacity", op.toFixed(3));
  grooves.appendChild(c);
}
function buildGrooves(){
  for(let r = 31; r <= 69.4; r += 1.35) ring(r, 0.022 + Math.random()*0.02, 0.55);
  [45.5, 55.5, 63.5].forEach(r => ring(r, 0.10, 0.85));   /* track separators */
  ring(70.6, 0.07, 0.9);                                  /* lead-in */
}

/* ═══════════════ helpers ═══════════════ */
const cur = () => state.idx >= 0 ? QUEUE[state.idx] : null;
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
let lastSec = -1;

function syncSeek(force){
  const t = cur();
  const frac = t ? Math.min(1, state.elapsed / t.d) : 0;
  if(!state.seeking || force) seek.value = Math.round(frac * 1000);
  seek.style.setProperty("--p", (frac*100).toFixed(2) + "%");
  const s = Math.floor(state.elapsed);
  if(s !== lastSec || force){ lastSec = s; tEl.textContent = fmt(state.elapsed); }
}

function measureTitle(){
  const over = tTitle.scrollWidth - titleWrap.clientWidth;
  if(over > 4){
    titleWrap.classList.add("of");
    tTitle.style.setProperty("--shift", -(over + 10) + "px");
    tTitle.style.setProperty("--scrollDur", Math.max(2.5, over/20) + "s");
  } else {
    titleWrap.classList.remove("of");
    tTitle.style.setProperty("--shift", "0px");
  }
}

/* ═══════════════ state transitions ═══════════════ */
function load(i){
  state.idx = i; state.elapsed = 0;
  const t = QUEUE[i];
  widget.classList.remove("idle"); widget.classList.add("loaded");
  tTitle.textContent = t.t; tArtist.textContent = t.a;
  tTot.textContent = fmt(t.d);
  titleWrap.title = t.t + " — " + t.a;
  seek.disabled = false;
  btnPrev.classList.remove("dim"); btnNext.classList.remove("dim");
  /* label livery */
  labBase.setAttribute("fill", t.lab);
  labR1.setAttribute("stroke", t.ink); labR2.setAttribute("stroke", t.ink);
  labT1.setAttribute("fill", t.ink);  labT2.setAttribute("fill", t.ink);
  if(t.art){ labArt.setAttribute("href", t.art); labArt.style.display = ""; }
  else labArt.style.display = "none";
  /* brief label dip on record change */
  labelG.style.opacity = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => labelG.style.opacity = 1));
  measureTitle();
  syncSeek(true);
}

function goIdle(){
  pause();
  state.idx = -1; state.elapsed = 0;
  widget.classList.add("idle"); widget.classList.remove("loaded");
  tTitle.textContent = "Nothing on the platter";
  tArtist.textContent = "Press play to drop a record";
  titleWrap.removeAttribute("title");
  tTot.textContent = "–:––";
  seek.disabled = true;
  btnPrev.classList.add("dim"); btnNext.classList.add("dim");
  measureTitle(); syncSeek(true);
}

function play(){
  if(state.idx < 0) load(0);
  state.playing = true;
  widget.classList.add("playing");
  btnPlay.setAttribute("aria-label", "Pause");
}
function pause(){
  state.playing = false;
  widget.classList.remove("playing");
  btnPlay.setAttribute("aria-label", "Play");
}
const toggle = () => state.playing ? pause() : play();
function next(){ if(state.idx >= 0) load((state.idx + 1) % QUEUE.length); }
function prev(){
  if(state.idx < 0) return;
  if(state.elapsed > 3){ state.elapsed = 0; syncSeek(true); }
  else load((state.idx - 1 + QUEUE.length) % QUEUE.length);
}

/* ═══════════════ main loop · spin & arm physics ═══════════════ */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = cur();

  /* tonearm — stylus follows the playhead across the groove radius   */
  const frac = t ? Math.min(1, state.elapsed / t.d) : 0;
  const base = t ? ARM.OUT + frac * (ARM.IN - ARM.OUT) : ARM.REST;
  const settled = t ? Math.abs(state.arm - base) < 1.0 : false;
  const needleDown = state.playing && settled;
  const target = t ? base + (state.playing ? 0 : ARM.LIFT) : ARM.REST;
  state.arm = RM.matches ? target
            : state.arm + (target - state.arm) * (1 - Math.exp(-dt / 0.38));
  armG.setAttribute("transform", "rotate(" + state.arm.toFixed(3) + " 198 42)");

  /* needle-contact shadow */
  const nT = needleDown ? 0.5 : 0;
  state.needle += (nT - state.needle) * (RM.matches ? 1 : 1 - Math.exp(-dt / 0.15));
  needleSh.setAttribute("opacity", state.needle.toFixed(3));

  /* platter — eased spin-up, long coast-down; static if reduced motion */
  if(!RM.matches){
    const targetOmega = state.playing ? SPEED[state.rpm] : 0;
    const tau = state.playing ? 0.55 : 0.95;
    state.omega += (targetOmega - state.omega) * (1 - Math.exp(-dt / tau));
    if(state.omega > 0.05){
      state.angle = (state.angle + state.omega * dt) % 360;
      spinG.setAttribute("transform", "rotate(" + state.angle.toFixed(2) + " 96 112)");
    }
  }

  /* playback clock — only once the stylus is in the groove */
  if(state.playing && t && (needleDown || RM.matches)){
    state.elapsed += dt;
    if(state.elapsed >= t.d) next();        /* auto-advance, stays playing */
    else syncSeek();
  }
  requestAnimationFrame(frame);
}

/* ═══════════════ controls ═══════════════ */
btnPlay.addEventListener("click", () => state.idx < 0 ? play() : toggle());
btnPrev.addEventListener("click", prev);
btnNext.addEventListener("click", next);
deckHit.addEventListener("click", () => state.idx < 0 ? play() : toggle());

seek.addEventListener("input", () => {
  const t = cur(); if(!t) return;
  state.elapsed = (seek.value / 1000) * t.d;
  syncSeek(true);
});
seek.addEventListener("pointerdown", () => state.seeking = true);
addEventListener("pointerup", () => state.seeking = false);

/* volume knob — drag vertically, scroll, or use arrow keys */
function setVol(v){
  v = Math.min(1, Math.max(0, v));
  state.vol = v;
  knobFace.style.setProperty("--rot", (-135 + 270 * v).toFixed(1) + "deg");
  const p = Math.round(v * 100);
  knob.setAttribute("aria-valuenow", p);
  knob.title = "Volume " + p + "%";
}
let dragging = false, dragY = 0, dragV = 0;
knob.addEventListener("pointerdown", e => {
  dragging = true; dragY = e.clientY; dragV = state.vol;
  knob.setPointerCapture(e.pointerId);
});
knob.addEventListener("pointermove", e => {
  if(dragging) setVol(dragV + (dragY - e.clientY) * 0.005);
});
knob.addEventListener("pointerup", () => dragging = false);
knob.addEventListener("wheel", e => {
  e.preventDefault();
  setVol(state.vol + (e.deltaY < 0 ? 0.05 : -0.05));
}, { passive: false });
knob.addEventListener("keydown", e => {
  const step = { ArrowUp:.05, ArrowRight:.05, ArrowDown:-.05, ArrowLeft:-.05, PageUp:.15, PageDown:-.15 }[e.key];
  if(step !== undefined){ e.preventDefault(); setVol(state.vol + step); }
  else if(e.key === "Home"){ e.preventDefault(); setVol(0); }
  else if(e.key === "End"){ e.preventDefault(); setVol(1); }
});

/* speed switch — purely mechanical charm; 45 simply spins faster */
function setRpm(n){
  state.rpm = n;
  seg33.classList.toggle("on", n === 33); seg33.setAttribute("aria-checked", n === 33);
  seg45.classList.toggle("on", n === 45); seg45.setAttribute("aria-checked", n === 45);
}
seg33.addEventListener("click", () => setRpm(33));
seg45.addEventListener("click", () => setRpm(45));

/* ═══════════════ init & embed API ═══════════════ */
buildGrooves();
setVol(state.vol);
new ResizeObserver(measureTitle).observe(titleWrap);
requestAnimationFrame(frame);

window.VinylWidget = {
  setQueue(q){ QUEUE.length = 0; QUEUE.push(...q); goIdle(); },
  load, play, pause, toggle, next, prev, setVolume: setVol,
};
})();
</script>
</body>
</html>
