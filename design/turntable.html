    <title>vinyl — turntable, phase 2</title>
    <!--
      Phase 2 design harness. Standalone: open this file directly, no build.

      Layout and finish are adapted from the Fable draft (vinyl-widget.html),
      which got the deck-plus-panel composition and the mechanical spin-up
      right. Three things changed:

        1. The platter no longer rotates from a per-frame rAF loop. That draft
           wrote SVG transforms 120 times a second forever, even while paused,
           which CLAUDE.md constraint 4 forbids outright for a widget that
           sits on screen all day. Rotation is now a single composited
           animation whose playbackRate is ramped by a rAF that terminates.
        2. Palette and type return to the dark hi-fi tokens. The draft had
           landed on cream, gold and terracotta with a Georgia label, which is
           the exact combination CLAUDE.md's "explicitly avoid" list names.
        3. The fake queue, volume knob and seek slider are gone. SMTC exposes
           no volume, Phase 5 has no seek, and CLAUDE.md rules out playlists.
           A debug panel drives the state instead, which is what Phase 2 is
           actually for.
    -->

      /* ═══════════════ 1 · TOKENS ═══════════════ */
      :root {
        --plinth: #16171a;
        --plinth-hi: #1e2024;
        --plinth-lo: #101115;
        --vinyl: #0b0b0d;
        --groove: #2a2c31;
        --mat: #121316;
        --steel: #8a8f98;
        --lamp: #ffb454;
        --lamp-soft: rgba(255, 180, 84, 0.5);
        --oxblood: #6e1f26;
        --text: #e8e9eb;
        --faint: #5f646c;

        --radius: 14px;
        --font-label: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        padding: 2rem;
        background: radial-gradient(
          1100px 640px at 40% 24%,
          #1d2026 0%,
          #0a0b0d 70%
        );
        font-family: var(--font-label);
        color: var(--text);
      }

      .stage-wrap {
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      .stage {
        width: 420px;
        height: 220px;
        min-width: 320px;
        min-height: 180px;
        max-width: 560px;
        max-height: 300px;
        resize: both;
        overflow: hidden;
        border-radius: var(--radius);
      }

      .hint {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--faint);
        user-select: none;
      }

      /* ═══════════════ 2 · WIDGET ROOT ═══════════════ */
      .vinyl-widget {
        container: vinylw / size;
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: stretch;
        border-radius: var(--radius);
        background: linear-gradient(
          178deg,
          var(--plinth-hi) 0%,
          var(--plinth) 46%,
          var(--plinth-lo) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 22px 44px -20px rgba(0, 0, 0, 0.7),
          0 5px 14px rgba(0, 0, 0, 0.38);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      /* Brushed machining on the chassis. Static layer, never on the platter:
         a live filter on the spinning group re-evaluates every frame. */
      .vinyl-widget::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.02 1.4' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
        opacity: 0.05;
        mix-blend-mode: overlay;
      }

      /* ═══════════════ 3 · DECK ═══════════════ */
      .deck {
        flex: none;
        height: 100%;
        aspect-ratio: 232/220;
        max-width: 56%;
        position: relative;
      }

      .deck svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* The record settles onto the platter when a session appears. */
      #vinylG {
        opacity: 0;
        transform: scale(0.962);
        transform-box: view-box;
        transform-origin: 96px 112px;
        transition:
          opacity 0.5s ease,
          transform 0.62s cubic-bezier(0.2, 0.75, 0.22, 1);
      }

      .vinyl-widget.loaded #vinylG {
        opacity: 1;
        transform: scale(1);
      }

      /* The one continuously animated thing in the whole widget: a single
         composited transform animation, rate-controlled from JS. Nothing
         writes to it per frame. */
      #spinG {
        transform-box: view-box;
        transform-origin: 96px 112px;
        will-change: transform;
      }

      #labelG {
        transition: opacity 0.26s ease;
      }

      /* The arm sweeps on a transition, not a frame loop. Real state updates
         it about twice a second, which is plenty. */
      #armG {
        transition: transform 420ms cubic-bezier(0.34, 1.36, 0.64, 1);
      }

      #needleSh {
        transition: opacity 240ms ease-out;
      }

      /* ═══════════════ 4 · PANEL ═══════════════ */
      .panel {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 12px 16px 13px 6px;
      }

      .flex {
        flex: 1;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 16px;
      }

      .lamp {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #34363a;
        box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.7);
        transition:
          background 0.35s,
          box-shadow 0.35s;
      }

      .vinyl-widget.loaded .lamp {
        background: rgba(255, 180, 84, 0.38);
      }

      .vinyl-widget.playing .lamp {
        background: var(--lamp);
        box-shadow: 0 0 7px 1.5px var(--lamp-soft);
      }

      .brand {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: var(--faint);
        transform: translateY(0.5px);
      }

      .speed {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--faint);
        letter-spacing: 0.04em;
      }

      .track {
        margin-top: auto;
        min-width: 0;
      }

      .title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .artist {
        margin-top: 3px;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--steel);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Progress is a readout, not a control: Phase 5 has no seek. */
      .progress {
        margin-top: 10px;
      }

      .bar {
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.11);
        overflow: hidden;
      }

      .bar i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: var(--lamp);
      }

      .times {
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 7px;
      }

      .tbtn {
        appearance: none;
        border: 1px solid transparent;
        margin: 0;
        padding: 0;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: transparent;
        color: #c3c8cf;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s,
          transform 0.1s;
      }

      .tbtn:hover {
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
      }

      .tbtn:active {
        transform: scale(0.93);
      }

      .tbtn.play {
        width: 37px;
        height: 37px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: var(--text);
        background: radial-gradient(circle at 34% 28%, #2b2e33, #1b1d21);
        box-shadow:
          0 2px 6px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }

      .tbtn.play:hover {
        border-color: var(--lamp-soft);
      }

      .tbtn svg {
        grid-area: 1/1;
      }

      #icPlay {
        margin-left: 1px;
        transition:
          opacity 0.16s,
          transform 0.16s;
      }

      #icPause {
        opacity: 0;
        transform: scale(0.7);
        transition:
          opacity 0.16s,
          transform 0.16s;
      }

      .vinyl-widget.playing #icPlay {
        opacity: 0;
        transform: scale(0.7);
      }

      .vinyl-widget.playing #icPause {
        opacity: 1;
        transform: scale(1);
      }

      /* Peak meter. One thin bar, nowhere near the platter: a throbbing
         record would read as a toy. */
      .meter {
        width: 46px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }

      .meter i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--lamp);
        border-radius: 2px;
      }

      :where(button):focus-visible {
        outline: 2px solid var(--lamp);
        outline-offset: 2px;
      }

      /* ═══════════════ 5 · RESPONSIVE ═══════════════ */
      @container vinylw (max-width: 378px) {
        .brand {
          display: none;
        }
        .panel {
          padding-right: 14px;
        }
      }

      @container vinylw (max-width: 352px) {
        .speed,
        .meter {
          display: none;
        }
        .deck {
          max-width: 52%;
        }
        .title {
          font-size: 13.5px;
        }
      }

      @container vinylw (max-height: 198px) {
        .panel {
          padding-top: 9px;
          padding-bottom: 10px;
        }
        .title {
          font-size: 13.5px;
        }
        .artist {
          margin-top: 2px;
        }
        .progress {
          margin-top: 7px;
        }
        .controls {
          margin-top: 5px;
        }
        .tbtn {
          width: 26px;
          height: 26px;
        }
        .tbtn.play {
          width: 33px;
          height: 33px;
        }
      }

      /* ═══════════════ 6 · REDUCED MOTION ═══════════════
         PLAN.md: cut the needle-drop swing to an instant cut. */
      @media (prefers-reduced-motion: reduce) {
        #armG,
        #needleSh,
        #vinylG {
          transition: none;
        }
      }

      /* ═══════════════ 7 · DEBUG PANEL (not the widget) ═══════════════ */
      #panel {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--steel);
        display: grid;
        gap: 0.8rem;
        width: 250px;
      }

      #panel h2 {
        font-family: var(--font-label);
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 11px;
        color: var(--text);
        margin: 0;
      }

      #panel label {
        display: grid;
        gap: 0.25rem;
      }

      #panel input[type="range"] {
        width: 100%;
        accent-color: var(--lamp);
      }

      #panel input[type="text"] {
        background: #101114;
        border: 1px solid #2a2c31;
        color: var(--text);
        font-family: var(--font-label);
        font-size: 12px;
        padding: 0.3rem 0.45rem;
        border-radius: 3px;
      }

      #panel .row {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }

      #panel button {
        background: #1d1f24;
        border: 1px solid #2a2c31;
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 10px;
        padding: 0.35rem 0.6rem;
        border-radius: 3px;
        cursor: pointer;
      }

      #panel button[aria-pressed="true"] {
        border-color: var(--lamp);
        color: var(--lamp);
      }

      #panel .readout {
        border-top: 1px solid #212329;
        padding-top: 0.6rem;
        line-height: 1.65;
        font-size: 10px;
      }

      #panel .readout b {
        color: var(--text);
        font-weight: 400;
      }
    </style>
  </head>

  <body>
    <div class="stage-wrap">
      <div class="stage">
        <div
          class="vinyl-widget"
          id="widget"
          role="group"
          aria-label="Vinyl record player"
        >
          <!-- ─── deck ─── -->
          <div class="deck">
            <svg
              viewBox="0 0 232 220"
              preserveAspectRatio="xMidYMid meet"
              aria-hidden="true"
            >
              <defs>
                <radialGradient id="gPlatter" cx="42%" cy="34%" r="68%">
                  <stop offset="0" stop-color="#6c727b" />
                  <stop offset="0.5" stop-color="#4a4e56" />
                  <stop offset="1" stop-color="#33363c" />
                </radialGradient>
                <linearGradient id="gTube" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#5b606a" />
                  <stop offset="0.38" stop-color="#aeb4bd" />
                  <stop offset="0.58" stop-color="#848a94" />
                  <stop offset="1" stop-color="#4a4e54" />
                </linearGradient>
                <radialGradient id="gCap" cx="36%" cy="30%" r="78%">
                  <stop offset="0" stop-color="#b3b8bf" />
                  <stop offset="0.55" stop-color="#787d84" />
                  <stop offset="1" stop-color="#484b51" />
                </radialGradient>
                <radialGradient id="gCw" cx="38%" cy="30%" r="80%">
                  <stop offset="0" stop-color="#878c93" />
                  <stop offset="0.6" stop-color="#565a61" />
                  <stop offset="1" stop-color="#35383d" />
                </radialGradient>
                <radialGradient id="gLabShade" cx="42%" cy="34%" r="72%">
                  <stop offset="0" stop-color="rgba(255,255,255,.10)" />
                  <stop offset="0.45" stop-color="rgba(255,255,255,0)" />
                  <stop offset="1" stop-color="rgba(0,0,0,.34)" />
                </radialGradient>
                <filter id="fB7" x="-40%" y="-40%" width="180%" height="180%">
                  <feGaussianBlur stdDeviation="7" />
                </filter>
                <filter id="fB5" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="5" />
                </filter>
                <filter id="fB2" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="1.4" />
                </filter>
                <mask id="mV">
                  <rect x="0" y="0" width="232" height="220" fill="#000" />
                  <circle cx="96" cy="112" r="72" fill="#fff" />
                </mask>
                <clipPath id="cLab">
                  <circle cx="96" cy="112" r="26" />
                </clipPath>
                <path id="labArc" d="M 80 112 A 16 16 0 0 1 112 112" fill="none" />
              </defs>

              <!-- platter well + platter -->
              <circle cx="96" cy="117" r="86" fill="#000" opacity=".5" filter="url(#fB5)" />
              <circle cx="96" cy="112" r="88" fill="#0c0d0f" />
              <circle cx="96" cy="112" r="88" fill="none" stroke="rgba(255,255,255,.045)" stroke-width="1" />
              <circle cx="96" cy="112" r="84" fill="url(#gPlatter)" stroke="#2b2e33" stroke-width="1" />
              <!-- strobe dots: the detail that actually sells the rotation,
                   since concentric grooves are rotationally symmetric -->
              <circle cx="96" cy="112" r="80" fill="none" stroke="#0e1013" opacity=".85"
                      stroke-width="2" stroke-dasharray="1.1 3.6" />
              <circle cx="96" cy="112" r="76" fill="var(--mat)" />
              <g fill="none" stroke="rgba(255,255,255,.03)" stroke-width=".7">
                <circle cx="96" cy="112" r="32" />
                <circle cx="96" cy="112" r="46" />
                <circle cx="96" cy="112" r="60" />
                <circle cx="96" cy="112" r="70" />
              </g>
              <circle cx="96" cy="112" r="3.2" fill="#08090a" />

              <!-- ─── the record ─── -->
              <g id="vinylG">
                <g id="spinG">
                  <circle cx="96" cy="112" r="72" fill="var(--vinyl)" />
                  <circle cx="96" cy="112" r="72" fill="none" stroke="#000" stroke-width="1" />
                  <g id="grooves" fill="none"></g>
                  <!-- lead-in seam, a second independent read on the spin -->
                  <path d="M 96 40.4 L 96 45.4" stroke="#565b64" stroke-width=".8" opacity=".8" />
                  <g id="labelG"></g>
                </g>
                <!-- Fixed-light sheen: the grooves rotate beneath it, which is
                     what real vinyl does. Outside #spinG on purpose. -->
                <g mask="url(#mV)" pointer-events="none">
                  <path d="M96 112 L14 4 L138 -18 Z" fill="#cdd8e8" opacity=".07" filter="url(#fB7)" />
                  <path d="M96 112 L186 218 L96 236 Z" fill="#aebbd0" opacity=".04" filter="url(#fB7)" />
                </g>
                <circle cx="96" cy="112" r="2.2" fill="url(#gCap)" stroke="rgba(0,0,0,.6)" stroke-width=".4" />
              </g>

              <!-- ─── tonearm ─── -->
              <g id="armRest">
                <ellipse cx="198" cy="122.5" rx="6.5" ry="2" fill="#000" opacity=".4" filter="url(#fB2)" />
                <rect x="193.2" y="117.4" width="9.6" height="5.2" rx="2.4"
                      fill="#17181b" stroke="rgba(255,255,255,.10)" stroke-width=".6" />
              </g>
              <g id="armBase">
                <circle cx="198" cy="42" r="13.5" fill="#1f2125" stroke="#2c2e33" stroke-width="1" />
              </g>
              <g id="armG" transform="rotate(0 198 42)">
                <!-- counterweight -->
                <circle cx="198" cy="23.5" r="7" fill="url(#gCw)" stroke="#1f2125" stroke-width=".8" />
                <path d="M192.4 21.6 H203.6 M192 23.5 H204 M192.4 25.4 H203.6"
                      stroke="rgba(0,0,0,.35)" stroke-width=".7" />
                <rect x="196.9" y="29" width="2.2" height="8" fill="#6b6f76" />
                <!-- bearing cap -->
                <circle cx="198" cy="42" r="6" fill="url(#gCap)" stroke="#212327" stroke-width=".8" />
                <circle cx="198" cy="42" r="1" fill="#32353a" />
                <!-- tube -->
                <line x1="198" y1="47" x2="198" y2="125" stroke="rgba(0,0,0,.35)" stroke-width="5.6" stroke-linecap="round" />
                <line x1="198" y1="47" x2="198" y2="125" stroke="url(#gTube)" stroke-width="4.2" stroke-linecap="round" />
                <line x1="197.1" y1="49" x2="197.1" y2="123" stroke="rgba(255,255,255,.5)" stroke-width=".7"
                      stroke-linecap="round" opacity=".5" />
                <!-- headshell, cartridge, stylus -->
                <path d="M194.4 123.5 h7.2 l1.1 12.6 a3.1 3.1 0 0 1 -3.1 3.4 h-3.4 a3.1 3.1 0 0 1 -3.1 -3.4 Z"
                      fill="#282a2f" stroke="#161719" stroke-width=".8" />
                <rect x="195.7" y="131.5" width="4.6" height="6.4" rx="1" fill="#16171a" />
                <path d="M197.1 138.2 l.9 3.6 .9 -3.6 Z" fill="#d5d9de" />
                <path d="M201.8 126.5 q4.4 1.4 4.6 5.6" stroke="#959ba3" stroke-width="1" fill="none" stroke-linecap="round" />
                <!-- contact shadow: pulls tight when the stylus is down, which
                     is how a top-down view expresses height -->
                <ellipse id="needleSh" cx="197.9" cy="143.4" rx="3.4" ry="1" fill="#000" opacity="0" filter="url(#fB2)" />
              </g>
            </svg>
          </div>

          <!-- ─── panel ─── -->
          <div class="panel">
            <div class="eyebrow">
              <span class="lamp" aria-hidden="true"></span>
              <span class="brand">PHONO</span>
              <span class="flex"></span>
              <span class="speed" id="uiSpeed">33⅓</span>
            </div>

            <div class="track" aria-live="polite">
              <div class="title" id="tTitle">No session</div>
              <div class="artist" id="tArtist">Nothing is playing</div>
            </div>

            <div class="progress">
              <div class="bar"><i id="uiBar"></i></div>
              <div class="times">
                <span id="tEl">0:00</span><span id="tTot">–:––</span>
              </div>
            </div>

            <div class="controls">
              <button id="btnPrev" class="tbtn" aria-label="Previous track">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
                  <path d="M6.2 5.2h2.3v13.6H6.2zM18.9 6.1v11.8c0 .95-1.05 1.52-1.85.98l-8.6-5.9a1.18 1.18 0 0 1 0-1.96l8.6-5.9c.8-.54 1.85.03 1.85.98z" />
                </svg>
              </button>
              <button id="btnPlay" class="tbtn play" aria-label="Play">
                <svg id="icPlay" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
                  <path d="M8.6 5.5v13c0 .96 1.06 1.54 1.86 1.02l10-6.5c.74-.48.74-1.56 0-2.04l-10-6.5C9.66 3.96 8.6 4.54 8.6 5.5z" />
                </svg>
                <svg id="icPause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
                  <path d="M7.4 5h3.1v14H7.4zM13.5 5h3.1v14h-3.1z" />
                </svg>
              </button>
              <button id="btnNext" class="tbtn" aria-label="Next track">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
                  <path d="M15.5 5.2h2.3v13.6h-2.3zM5.1 6.1v11.8c0 .95 1.05 1.52 1.85.98l8.6-5.9c.78-.53.78-1.43 0-1.96l-8.6-5.9C6.15 4.58 5.1 5.15 5.1 6.1z" />
                </svg>
              </button>
              <span class="flex"></span>
              <div class="meter" aria-hidden="true"><i id="uiMeter"></i></div>
            </div>
          </div>
        </div>
      </div>
      <div class="hint">drag the corner to resize · 320×180 – 560×300</div>
    </div>

    <aside id="panel">
      <h2>Debug state</h2>

      <label>
        <span>position <b id="v-position">0%</b></span>
        <input id="c-position" type="range" min="0" max="100" step="0.5" value="0" />
      </label>

      <label>
        <span>peak <b id="v-peak">0.20</b></span>
        <input id="c-peak" type="range" min="0" max="1" step="0.01" value="0.2" />
      </label>

      <div class="row">
        <button id="c-play" aria-pressed="false">play</button>
        <button id="c-rpm" aria-pressed="false">33 / 45</button>
        <button id="c-session" aria-pressed="true">session</button>
      </div>

      <div class="row">
        <button id="c-art" aria-pressed="false">art</button>
        <button id="c-live" aria-pressed="false">live</button>
      </div>

      <label>
        <span>title</span>
        <input id="c-title" type="text" value="Alone Again" />
      </label>

      <label>
        <span>artist</span>
        <input id="c-artist" type="text" value="The Weeknd" />
      </label>

      <div class="readout">
        revolution <b id="r-rev">—</b> &middot; rate <b id="r-rate">—</b><br />
        stylus <b id="r-radius">—</b> &middot; arm <b id="r-angle">—</b><br />
        reduced motion <b id="r-motion">—</b>
      </div>
    </aside>

    <script type="module">
      const $ = (s) => document.querySelector(s);
      const NS = "http://www.w3.org/2000/svg";
      const RM = matchMedia("(prefers-reduced-motion: reduce)");

      const widget = $("#widget");
      const spinG = $("#spinG");
      const armG = $("#armG");
      const grooves = $("#grooves");
      const labelG = $("#labelG");
      const needleSh = $("#needleSh");

      /* ══════════════════════════════════════════════════════════════════
       * Geometry
       *
       * Platter centre (96,112), record r 72, label r 26, arm pivot (198,42).
       * The arm is drawn pointing straight down, so a rotation of 0 means
       * "along +y". Engagement angles are derived by intersecting the stylus
       * arc with the groove radius, so the stylus genuinely tracks the
       * playhead rather than sweeping between two eyeballed numbers.
       * ══════════════════════════════════════════════════════════════════ */
      const CENTER = { x: 96, y: 112 };
      const PIVOT = { x: 198, y: 42 };
      const RECORD_R = 72;
      const LABEL_R = 26;
      const ARM_LEN = 98; // pivot to stylus, as drawn
      const PIVOT_DIST = Math.hypot(PIVOT.x - CENTER.x, PIVOT.y - CENTER.y);

      const R_LEAD_IN = RECORD_R * 0.92;
      const R_RUN_OUT = LABEL_R + 3;

      const BASE_ANGLE =
        (Math.atan2(CENTER.y - PIVOT.y, CENTER.x - PIVOT.x) * 180) / Math.PI;
      const DRAWN_ANGLE = 90; // the arm is drawn pointing down

      function armRotationFor(radius) {
        const cos =
          (ARM_LEN * ARM_LEN + PIVOT_DIST * PIVOT_DIST - radius * radius) /
          (2 * ARM_LEN * PIVOT_DIST);
        const theta = (Math.acos(Math.min(1, Math.max(-1, cos))) * 180) / Math.PI;
        return BASE_ANGLE - theta - DRAWN_ANGLE;
      }

      const REST_ROTATION = -8.5; // parked over the arm rest

      /* ══════════════════════════════════════════════════════════════════
       * State, shaped like the real PlaybackState so Phase 3 is a swap.
       * ══════════════════════════════════════════════════════════════════ */
      const state = {
        session: true,
        playing: false,
        position: 0,
        rpm: 33,
        peak: 0.2,
        hasArt: false,
        live: false,
        title: "Alone Again",
        artist: "The Weeknd",
        durationMs: 250000,
      };

      let meterShown = 0;

      /* ══════════════════════════════════════════════════════════════════
       * Rotation.
       *
       * One composited animation. CLAUDE.md constraint 4 forbids writing the
       * platter transform per frame, so nothing does. The rAF below runs only
       * during a spin-up or spin-down ramp and then terminates, which is what
       * keeps the idle cost at zero.
       * ══════════════════════════════════════════════════════════════════ */
      const spin = spinG.animate(
        [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }],
        { duration: 1800, iterations: Infinity, easing: "linear" },
      );
      spin.playbackRate = 0;
      spin.pause();

      let ramp = null;

      function rampSpinTo(target) {
        if (ramp !== null) cancelAnimationFrame(ramp);

        if (RM.matches) {
          spin.playbackRate = target;
          if (target === 0) spin.pause();
          else spin.play();
          ramp = null;
          return;
        }

        // Direct drive reaches speed quickly and coasts down slowly.
        const tau = target > 0 ? 550 : 950;
        let last = performance.now();
        if (target > 0) spin.play();

        const step = (now) => {
          const dt = Math.min(64, now - last);
          last = now;
          const rate =
            spin.playbackRate +
            (target - spin.playbackRate) * (1 - Math.exp(-dt / tau));

          if (Math.abs(target - rate) < 0.012) {
            spin.playbackRate = target;
            if (target === 0) spin.pause();
            ramp = null;
            return;
          }
          spin.playbackRate = rate;
          ramp = requestAnimationFrame(step);
        };
        ramp = requestAnimationFrame(step);
      }

      /* ══════════════════════════════════════════════════════════════════
       * Grooves. Seeded, so a given build always presses the same record.
       * Varied pitch plus the wider bands a real pressing shows between
       * tracks, which is what stops it reading as graph paper.
       * ══════════════════════════════════════════════════════════════════ */
      function seededRandom(seed) {
        let v = seed;
        return () => {
          v = (v * 1664525 + 1013904223) % 4294967296;
          return v / 4294967296;
        };
      }

      function ring(r, opacity, width) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", CENTER.x);
        c.setAttribute("cy", CENTER.y);
        c.setAttribute("r", r.toFixed(2));
        c.setAttribute("stroke", "#8f96a2");
        c.setAttribute("stroke-width", width);
        c.setAttribute("opacity", opacity.toFixed(3));
        grooves.appendChild(c);
      }

      function buildGrooves() {
        const rand = seededRandom(20220517);
        for (let r = R_RUN_OUT; r <= R_LEAD_IN; r += 1.05 + rand() * 0.5) {
          ring(r, 0.03 + rand() * 0.035, 0.55);
        }
        [40.5, 50.5, 59.5].forEach((r) => ring(r, 0.13, 0.9)); // track gaps
        ring(R_LEAD_IN + 1.4, 0.1, 0.9); // lead-in
      }

      /* ══════════════════════════════════════════════════════════════════
       * The label
       * ══════════════════════════════════════════════════════════════════ */
      const FAKE_ART = `data:image/svg+xml;utf8,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
           <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
             <stop offset="0%" stop-color="#26323f"/><stop offset="100%" stop-color="#5e2b34"/>
           </linearGradient></defs>
           <rect width="160" height="160" fill="url(#g)"/>
           <circle cx="56" cy="54" r="30" fill="#e8e9eb" opacity="0.85"/>
           <rect x="30" y="104" width="98" height="7" fill="#ffb454" opacity="0.9"/>
           <rect x="30" y="120" width="58" height="7" fill="#e8e9eb" opacity="0.5"/>
         </svg>`,
      )}`;

      function hashOf(input) {
        let h = 2166136261;
        for (let i = 0; i < input.length; i += 1) {
          h ^= input.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return Math.abs(h);
      }

      function escapeXml(v) {
        return v.replace(
          /[<>&"]/g,
          (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" })[c],
        );
      }

      /** Truncates rather than letting type spill off the arc. */
      function fitText(el, maxLength) {
        if (!el) return;
        const full = el.textContent;
        if (el.getComputedTextLength() <= maxLength) return;
        for (let cut = full.length - 1; cut > 0; cut -= 1) {
          el.textContent = `${full.slice(0, cut).trimEnd()}…`;
          if (el.getComputedTextLength() <= maxLength) return;
        }
      }

      function buildLabel() {
        if (state.hasArt) {
          labelG.innerHTML = `
            <g clip-path="url(#cLab)">
              <image href="${FAKE_ART}" x="70" y="86" width="52" height="52" preserveAspectRatio="xMidYMid slice"/>
              <circle cx="96" cy="112" r="26" fill="url(#gLabShade)"/>
            </g>
            <circle cx="96" cy="112" r="26" fill="none" stroke="#000" stroke-opacity=".6" stroke-width=".9"/>
            <circle cx="96" cy="112" r="25.3" fill="none" stroke="var(--steel)" stroke-opacity=".22" stroke-width=".5"/>
            <circle cx="96" cy="112" r="2.6" fill="#0b0c0d"/>`;
          return;
        }

        // Procedural label. Phase 3 grows this to five archetypes; Phase 2
        // needs one that already reads as deliberate rather than degraded.
        const seed = hashOf(`${state.artist}|${state.title}`);
        const catalogue = `VNL-${(seed % 9000) + 1000}`;

        labelG.innerHTML = `
          <circle cx="96" cy="112" r="26" fill="#2b2f35"/>
          <circle cx="96" cy="112" r="26" fill="url(#gLabShade)"/>
          <circle cx="96" cy="112" r="25.3" fill="none" stroke="var(--steel)" stroke-opacity=".3" stroke-width=".5"/>
          <circle cx="96" cy="112" r="21" fill="none" stroke="var(--oxblood)" stroke-width="1.1"/>
          <text id="labTitle" font-family="var(--font-label)" font-size="4.8" font-weight="600"
                letter-spacing=".55" fill="var(--text)" text-anchor="middle">
            <textPath href="#labArc" startOffset="50%">${escapeXml(state.title.toUpperCase())}</textPath>
          </text>
          <text id="labArtist" x="96" y="122" font-family="var(--font-label)" font-size="4"
                font-weight="500" letter-spacing=".45" fill="var(--steel)" text-anchor="middle">${escapeXml(
                  state.artist.toUpperCase(),
                )}</text>
          <text x="96" y="128.5" font-family="var(--font-mono)" font-size="3.1"
                fill="var(--steel)" fill-opacity=".7" text-anchor="middle">${catalogue}</text>
          <circle cx="96" cy="112" r="2.6" fill="#0b0c0d"/>`;

        // The arc spans half the circumference of an r=16 circle.
        fitText($("#labTitle"), Math.PI * 16 * 0.94);
        fitText($("#labArtist"), 38);
      }

      /* ══════════════════════════════════════════════════════════════════
       * Render. Runs on state change and at 4 Hz to decay the meter, never
       * per frame.
       * ══════════════════════════════════════════════════════════════════ */
      function formatTime(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const m = Math.floor(total / 60);
        return `${m}:${String(total % 60).padStart(2, "0")}`;
      }

      let lastRate = null;
      let lastRotation = null;

      function render() {
        const running = state.session && state.playing;
        widget.classList.toggle("loaded", state.session);
        widget.classList.toggle("playing", running);

        const wantRate = running ? 1 : 0;
        if (wantRate !== lastRate) {
          lastRate = wantRate;
          rampSpinTo(wantRate);
        }

        spin.effect.updateTiming({ duration: state.rpm === 45 ? 1333.33 : 1800 });
        $("#uiSpeed").textContent = state.rpm === 45 ? "45" : "33⅓";

        // A livestream has no duration, so there is no progress to show. Park
        // the arm at the lead-in rather than inventing a position.
        const radius = state.live
          ? R_LEAD_IN
          : R_LEAD_IN + (R_RUN_OUT - R_LEAD_IN) * state.position;

        // Only write when it actually moves. Rewriting an unchanged transform
        // still invalidates, and this runs on a 4 Hz tick.
        const rotation = running ? armRotationFor(radius) : REST_ROTATION;
        if (rotation !== lastRotation) {
          lastRotation = rotation;
          armG.setAttribute("transform", `rotate(${rotation.toFixed(3)} 198 42)`);
        }
        needleSh.setAttribute("opacity", running ? "0.5" : "0");

        if (state.session) {
          $("#tTitle").textContent = state.title || "Unknown";
          $("#tArtist").textContent = state.artist || "Unknown artist";
          $("#tEl").textContent = state.live
            ? "LIVE"
            : formatTime(state.durationMs * state.position);
          $("#tTot").textContent = state.live ? "" : formatTime(state.durationMs);
          $("#uiBar").style.width = state.live
            ? "0%"
            : `${(state.position * 100).toFixed(2)}%`;
        } else {
          $("#tTitle").textContent = "No session";
          $("#tArtist").textContent = "Nothing is playing";
          $("#tEl").textContent = "0:00";
          $("#tTot").textContent = "–:––";
          $("#uiBar").style.width = "0%";
        }

        // Fast attack, slow release, so the meter tracks loudness rather than
        // flickering on every sample.
        const target = running ? state.peak : 0;
        meterShown =
          target > meterShown ? target : meterShown + (target - meterShown) * 0.3;
        $("#uiMeter").style.width = `${(meterShown * 100).toFixed(1)}%`;

        $("#r-rev").textContent = `${(spin.effect.getTiming().duration / 1000).toFixed(4)}s`;
        $("#r-rate").textContent = spin.playbackRate.toFixed(2);
        $("#r-radius").textContent = `${radius.toFixed(1)}px`;
        $("#r-angle").textContent = `${rotation.toFixed(1)}°`;
        $("#r-motion").textContent = RM.matches ? "reduce" : "no-preference";
      }

      /* ══════════════════════════════════════════════════════════════════
       * Wiring
       * ══════════════════════════════════════════════════════════════════ */
      function toggle(id, key, after) {
        $(id).addEventListener("click", (e) => {
          state[key] = !state[key];
          e.currentTarget.setAttribute("aria-pressed", String(state[key]));
          if (after) after();
          render();
        });
      }

      function bind() {
        $("#c-position").addEventListener("input", (e) => {
          state.position = Number(e.target.value) / 100;
          $("#v-position").textContent = `${e.target.value}%`;
          render();
        });

        $("#c-peak").addEventListener("input", (e) => {
          state.peak = Number(e.target.value);
          $("#v-peak").textContent = state.peak.toFixed(2);
          render();
        });

        toggle("#c-play", "playing");
        toggle("#c-session", "session");
        toggle("#c-live", "live");
        toggle("#c-art", "hasArt", buildLabel);

        $("#c-rpm").addEventListener("click", (e) => {
          state.rpm = state.rpm === 33 ? 45 : 33;
          e.currentTarget.setAttribute("aria-pressed", String(state.rpm === 45));
          render();
        });

        $("#c-title").addEventListener("input", (e) => {
          state.title = e.target.value;
          buildLabel();
          render();
        });

        $("#c-artist").addEventListener("input", (e) => {
          state.artist = e.target.value;
          buildLabel();
          render();
        });

        // The transport row mirrors the debug state for now. Phase 5 wires
        // these to TryTogglePlayPauseAsync and friends.
        const restart = () => {
          state.position = 0;
          $("#c-position").value = 0;
          $("#v-position").textContent = "0%";
          render();
        };
        $("#btnPlay").addEventListener("click", () => $("#c-play").click());
        $("#btnPrev").addEventListener("click", restart);
        $("#btnNext").addEventListener("click", restart);
      }

      buildGrooves();
      await document.fonts.ready;
      buildLabel();
      bind();
      render();
      // 4 Hz, only to decay the meter. Nothing here touches the platter.
      setInterval(render, 250);
    </script>
  </body>
</html>
