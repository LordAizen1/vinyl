<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vinyl</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>

  <body>
    <div class="vinyl-widget" id="widget" role="group" aria-label="Now playing">
      <!-- ─── deck ─── -->
      <div class="deck">
        <svg
          viewBox="0 0 232 220"
          preserveAspectRatio="xMidYMid meet"
          aria-hidden="true"
        >
          <defs>
            <radialGradient id="gPlatter" cx="42%" cy="34%" r="68%">
              <stop offset="0" stop-color="#6c727b" />
              <stop offset="0.5" stop-color="#4a4e56" />
              <stop offset="1" stop-color="#33363c" />
            </radialGradient>
            <!-- userSpaceOnUse, not the default objectBoundingBox: the tube is
                 a vertical <line>, whose bounding box is zero pixels wide, so
                 a bounding-box gradient collapses and the tube renders flat
                 black. These coordinates span the tube's actual 4.2px width. -->
            <linearGradient
              id="gTube"
              gradientUnits="userSpaceOnUse"
              x1="195.25"
              y1="0"
              x2="200.75"
              y2="0"
            >
              <stop offset="0" stop-color="#4e535b" />
              <stop offset="0.3" stop-color="#b4bac2" />
              <stop offset="0.55" stop-color="#8b9199" />
              <stop offset="1" stop-color="#43474d" />
            </linearGradient>
            <radialGradient id="gCap" cx="36%" cy="30%" r="78%">
              <stop offset="0" stop-color="#b3b8bf" />
              <stop offset="0.55" stop-color="#787d84" />
              <stop offset="1" stop-color="#484b51" />
            </radialGradient>
            <radialGradient id="gCw" cx="38%" cy="30%" r="80%">
              <stop offset="0" stop-color="#878c93" />
              <stop offset="0.6" stop-color="#565a61" />
              <stop offset="1" stop-color="#35383d" />
            </radialGradient>
            <radialGradient id="gLabShade" cx="42%" cy="34%" r="72%">
              <stop offset="0" stop-color="rgba(255,255,255,.10)" />
              <stop offset="0.45" stop-color="rgba(255,255,255,0)" />
              <stop offset="1" stop-color="rgba(0,0,0,.34)" />
            </radialGradient>
            <filter id="fB7" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="7" />
            </filter>
            <filter id="fB5" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="5" />
            </filter>
            <filter id="fB2" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="1.4" />
            </filter>
            <mask id="mV">
              <rect x="0" y="0" width="232" height="220" fill="#000" />
              <circle cx="96" cy="112" r="72" fill="#fff" />
            </mask>
            <clipPath id="cLab">
              <circle cx="96" cy="112" r="26" />
            </clipPath>
          </defs>

          <!-- platter well + platter -->
          <circle cx="96" cy="117" r="86" fill="#000" opacity=".5" filter="url(#fB5)" />
          <circle cx="96" cy="112" r="88" fill="#0c0d0f" />
          <circle cx="96" cy="112" r="88" fill="none" stroke="rgba(255,255,255,.045)" stroke-width="1" />
          <circle cx="96" cy="112" r="84" fill="url(#gPlatter)" stroke="#2b2e33" stroke-width="1" />
          <!-- strobe dots: concentric grooves are rotationally symmetric, so
               this is what actually reads as rotation -->
          <circle cx="96" cy="112" r="80" fill="none" stroke="#0e1013" opacity=".85"
                  stroke-width="2" stroke-dasharray="1.1 3.6" />
          <circle cx="96" cy="112" r="76" fill="var(--mat)" />
          <g fill="none" stroke="rgba(255,255,255,.03)" stroke-width=".7">
            <circle cx="96" cy="112" r="32" />
            <circle cx="96" cy="112" r="46" />
            <circle cx="96" cy="112" r="60" />
            <circle cx="96" cy="112" r="70" />
          </g>
          <circle cx="96" cy="112" r="3.2" fill="#08090a" />

          <!-- ─── the record ─── -->
          <g id="vinylG">
            <g id="spinG">
              <circle cx="96" cy="112" r="72" fill="var(--vinyl)" />
              <circle cx="96" cy="112" r="72" fill="none" stroke="#000" stroke-width="1" />
              <g id="grooves" fill="none"></g>
              <path d="M 96 40.4 L 96 45.4" stroke="#565b64" stroke-width=".8" opacity=".8" />
              <g id="labelG"></g>
            </g>
            <!-- Fixed-light sheen: the grooves turn beneath it, which is what
                 real vinyl does. Outside #spinG on purpose. -->
            <g mask="url(#mV)" pointer-events="none">
              <path d="M96 112 L14 4 L138 -18 Z" fill="#d5dfee" opacity=".13" filter="url(#fB7)" />
              <path d="M96 112 L186 218 L96 236 Z" fill="#b6c3d8" opacity=".075" filter="url(#fB7)" />
            </g>
            <circle cx="96" cy="112" r="2.2" fill="url(#gCap)" stroke="rgba(0,0,0,.6)" stroke-width=".4" />
          </g>

          <!-- ─── tonearm ─── -->
          <g id="armRest">
            <ellipse cx="198" cy="122.5" rx="6.5" ry="2" fill="#000" opacity=".4" filter="url(#fB2)" />
            <rect x="193.2" y="117.4" width="9.6" height="5.2" rx="2.4"
                  fill="#17181b" stroke="rgba(255,255,255,.10)" stroke-width=".6" />
          </g>

          <!-- Cue lever. On a real deck this is the pause: it raises the arm
               hydraulically while the platter keeps turning. Down means the
               stylus is in the groove. Sits beside the arm rest, where a
               Technics puts it. Clicking it toggles playback. -->
          <g id="cue" cursor="pointer">
            <!-- machined slot -->
            <rect x="212.5" y="96" width="10" height="27" rx="5" fill="#0d0f12" />
            <rect x="212.5" y="96" width="10" height="27" rx="5" fill="none"
                  stroke="rgba(255,255,255,.08)" stroke-width=".7" />
            <g id="cueKnob">
              <rect x="208.4" y="110.5" width="18.2" height="9.6" rx="3" fill="url(#gCw)"
                    stroke="#191b1f" stroke-width=".8" />
              <rect x="208.4" y="110.5" width="18.2" height="3.2" rx="1.6"
                    fill="rgba(255,255,255,.16)" />
              <path d="M210.8 115.4 H224.2 M210.8 117.4 H224.2"
                    stroke="rgba(0,0,0,.34)" stroke-width=".6" />
            </g>
            <!-- generous hit area; the lever itself is small -->
            <rect x="203" y="92" width="28" height="36" fill="transparent" />
          </g>
          <g id="armBase">
            <circle cx="198" cy="42" r="13.5" fill="#1f2125" stroke="#2c2e33" stroke-width="1" />
          </g>
          <g id="armG" transform="rotate(0 198 42)">
            <!-- counterweight: a machined capsule, which is what a real arm
                 carries and what the reference shows, not a knurled sphere -->
            <rect x="192.4" y="14.5" width="11.2" height="17" rx="5.6" fill="url(#gCw)"
                  stroke="#1d1f23" stroke-width=".8" />
            <rect x="193.2" y="15.4" width="9.6" height="4.6" rx="2.3" fill="#a3a9b1" opacity=".3" />
            <path d="M193.8 21.5 H202.2 M193.6 24 H202.4 M193.8 26.5 H202.2"
                  stroke="rgba(0,0,0,.3)" stroke-width=".6" />
            <rect x="196.6" y="30" width="2.8" height="7.6" fill="#6b6f76" />
            <circle cx="198" cy="42" r="6" fill="url(#gCap)" stroke="#212327" stroke-width=".8" />
            <circle cx="198" cy="42" r="1" fill="#32353a" />

            <!-- Tube, 5.5 wide. A real tonearm is about 3.5% of the record
                 diameter and the reference illustration exaggerates to roughly
                 5.5%; this sits between the two. -->
            <line x1="198" y1="47" x2="198" y2="124" stroke="rgba(0,0,0,.4)" stroke-width="7.2" stroke-linecap="round" />
            <line x1="198" y1="47" x2="198" y2="124" stroke="url(#gTube)" stroke-width="5.5" stroke-linecap="round" />
            <line x1="196.5" y1="49" x2="196.5" y2="122" stroke="rgba(255,255,255,.55)" stroke-width=".8"
                  stroke-linecap="round" opacity=".5" />

            <!-- Headshell, kicked out at the offset angle. A pivoted arm angles
                 the cartridge toward the spindle so the stylus sits nearer to
                 tangent in the groove, and it is the detail that most makes
                 this read as a tonearm rather than a stick. The 21 degrees is
                 accounted for in main.js, which corrects ARM_LEN and the drawn
                 bearing so the stylus still tracks the right groove radius. -->
            <g transform="rotate(21 198 124)">
              <path d="M193.8 123 h8.4 l1 12.6 a3.4 3.4 0 0 1 -3.4 3.7 h-3.6 a3.4 3.4 0 0 1 -3.4 -3.7 Z"
                    fill="#3a3e45" stroke="#141517" stroke-width=".8" />
              <path d="M193.8 123 h8.4 l.2 2.8 h-8.8 Z" fill="#616770" />
              <!-- cartridge, a separate darker body beneath the headshell -->
              <rect x="195.3" y="130.6" width="5.4" height="6.8" rx="1.1" fill="#1a1c20" stroke="#0b0c0e" stroke-width=".5" />
              <rect x="196" y="131.5" width="4" height="1.3" rx=".65" fill="#6d737b" opacity=".7" />
              <path d="M197.1 137.6 l.9 4.1 .9 -4.1 Z" fill="#dfe3e8" />
              <!-- finger lift, on the headshell's flank -->
              <path d="M202 127 h5.4 a1.5 1.5 0 0 1 0 3 h-5.4 z" fill="#8f959e" />
              <path d="M202 127 h5.4 a1.5 1.5 0 0 1 .6 .5 h-6 z" fill="#b6bcc4" opacity=".8" />
              <!-- contact shadow: pulls tight when the stylus is down, which is
                   how a top-down view expresses height -->
              <ellipse id="needleSh" cx="197.9" cy="143.4" rx="3.4" ry="1" fill="#000" opacity="0" filter="url(#fB2)" />
            </g>
          </g>
        </svg>
      </div>

      <!-- ─── panel ─── -->
      <div class="panel">
        <!-- Lamp, then the brand plate, then the actual source. A real deck
             carries the maker's name on the plinth in this position; PHONO,
             which used to sit here, is an amplifier input label and belongs
             on the thing you plug a turntable into, not on the turntable. -->
        <div class="eyebrow">
          <span class="lamp" id="uiLamp" aria-hidden="true"></span>
          <span class="brand">Vinyl</span>
          <span class="flex"></span>
          <span class="speed" id="uiSource"></span>
        </div>

        <div class="track" aria-live="polite">
          <div class="title" id="uiTitle">No session</div>
          <div class="artist" id="uiArtist">Nothing is playing</div>
        </div>

        <div class="progress">
          <div class="bar"><i id="uiBar"></i></div>
          <div class="times">
            <span id="uiElapsed">0:00</span><span id="uiTotal">–:––</span>
          </div>
        </div>

        <!-- Controls take the form of the real thing they correspond to.
             Play/pause is the round START/STOP button a Technics puts at the
             front left. Skip has no analogue on any turntable, so it borrows
             the form of the 33/45 speed selector, which does exist, rather
             than inventing hardware that never existed.

             Only ever shows what PlaybackInfo.Controls says the source
             supports: a dead skip button on a livestream is a bug. -->
        <div class="controls">
          <button id="btnPrev" class="selector" type="button" aria-label="Previous track">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true">
              <path d="M6.2 5.2h2.3v13.6H6.2zM18.9 6.1v11.8c0 .95-1.05 1.52-1.85.98l-8.6-5.9a1.18 1.18 0 0 1 0-1.96l8.6-5.9c.8-.54 1.85.03 1.85.98z" />
            </svg>
          </button>

          <button id="btnPlay" class="startstop" type="button" aria-label="Play">
            <span class="startstop-face">
              <svg id="icPlay" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
                <!-- The glyph's own bounding box is centred at x 14.81 against
                     a viewBox centre of 12, which is why it read as shifted
                     right. Measured and corrected rather than eyeballed. -->
                <path
                  transform="translate(-2.81 0)"
                  d="M8.6 5.5v13c0 .96 1.06 1.54 1.86 1.02l10-6.5c.74-.48.74-1.56 0-2.04l-10-6.5C9.66 3.96 8.6 4.54 8.6 5.5z"
                />
              </svg>
              <svg id="icPause" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
                <path d="M7.4 5h3.1v14H7.4zM13.5 5h3.1v14h-3.1z" />
              </svg>
            </span>
          </button>

          <button id="btnNext" class="selector" type="button" aria-label="Next track">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true">
              <path d="M15.5 5.2h2.3v13.6h-2.3zM5.1 6.1v11.8c0 .95 1.05 1.52 1.85.98l8.6-5.9c.78-.53.78-1.43 0-1.96l-8.6-5.9C6.15 4.58 5.1 5.15 5.1 6.1z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
