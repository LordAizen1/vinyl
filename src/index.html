<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vinyl</title>
    <link rel="stylesheet" href="styles.css" />
    <!--
      Runs before first paint. styles.css keys its dark palette off
      [data-theme="dark"] rather than a media query, so that the context menu can
      override it; without this line a dark desktop would paint the silver
      widget for a frame before main.js loads. main.js takes over from here,
      applying the saved choice and watching the system setting.
    -->
    <script>
      document.documentElement.dataset.theme = matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches
        ? "dark"
        : "light";
    </script>
    <script type="module" src="main.js" defer></script>
  </head>

  <body>
    <!--
      Geometry and proportions follow the supplied silver reference build.
      What differs is the engine: the platter runs as one composited animation
      and the arm on a transition, rather than a rAF loop writing SVG
      transforms every frame. See CLAUDE.md constraint 4.

      Every colour comes from a CSS class, never a fill attribute: Chromium
      does not resolve var() inside SVG presentation attributes, so
      fill="var(--x)" fails silently and theming would break.
    -->
    <div class="widget" id="widget">
      <div class="face">
        <!-- ─── the plate: a raised panel, record straight onto it ─── -->
        <div class="plate">
          <svg viewBox="0 0 715 700" aria-hidden="true">
            <defs>
              <radialGradient id="gVinyl" cx="46%" cy="42%" r="65%">
                <stop offset="0" class="s-vinyl-hi" />
                <stop offset=".45" class="s-vinyl-mid" />
                <stop offset=".78" class="s-vinyl-lo" />
                <stop offset="1" class="s-vinyl-edge" />
              </radialGradient>
              <radialGradient id="gSpin" cx="35%" cy="30%" r="80%">
                <stop offset="0" class="s-metal-hi" />
                <stop offset=".55" class="s-metal-mid" />
                <stop offset="1" class="s-metal-lo" />
              </radialGradient>
              <radialGradient id="gLabShade" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#fff" stop-opacity=".10" />
                <stop offset=".62" stop-color="#000" stop-opacity="0" />
                <stop offset="1" stop-color="#000" stop-opacity=".28" />
              </radialGradient>
              <linearGradient id="gSheen" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity=".13" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
              <filter id="fB16" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="16" />
              </filter>
              <filter id="fB8" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="8" />
              </filter>
              <clipPath id="cLab"><circle cx="335" cy="345" r="92" /></clipPath>
              <clipPath id="cRec"><circle cx="335" cy="345" r="303" /></clipPath>
            </defs>

            <!-- Corner pins: flat metal discs. Both share cx, so they read as
                 one vertical line down the left edge. -->
            <circle class="screw" cx="60" cy="65" r="22" stroke-width="1" />
            <circle class="screw" cx="60" cy="635" r="22" stroke-width="1" />

            <circle cx="345" cy="361" r="303" fill="#000" opacity=".32" filter="url(#fB16)" />

            <!-- ─── the record ─── -->
            <g id="vinylG">
              <circle cx="335" cy="345" r="303" fill="url(#gVinyl)" />
              <g id="spinG">
                <g id="grooves"></g>
                <g id="labelG"></g>
              </g>

              <!-- Fixed-light sheen above the rotating surface: the grooves
                   turn beneath it, which is what real vinyl does. -->
              <g clip-path="url(#cRec)" opacity=".55">
                <path d="M335 345 L95 105 A339 339 0 0 1 260 22 Z" fill="url(#gSheen)" filter="url(#fB8)" />
                <path d="M335 345 L575 585 A339 339 0 0 1 410 668 Z" fill="url(#gSheen)" filter="url(#fB8)" opacity=".7" />
              </g>
              <circle cx="335" cy="345" r="301.5" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.7" />

              <circle cx="335" cy="345" r="14" fill="url(#gSpin)" />
              <circle cx="335" cy="345" r="14" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1" />
              <circle class="spindle-pin" cx="335" cy="345" r="5.4" />
              <circle cx="331.6" cy="341.4" r="1.8" fill="#fff" opacity=".85" />
            </g>

            <!-- ─── tonearm ───
                 Drawn flat: solid fills with a hairline edge, no highlight
                 ramps and no cast shadow. Matches the corner pins. -->
            <g id="armG" transform="rotate(80.2 640 105)">
              <!-- No counterweight behind the bearing: the arm reads as one
                   clean line out of the pivot disc. -->

              <!-- Straight tube, then the bend. A J-arm: the tube runs true out
                   of the bearing and only turns near the headshell. Stroked
                   twice, wider and darker underneath, so the flat bar keeps an
                   outline over both the light plate and the black record. -->
              <path class="arm-tube-edge" d="M672 105 H860 C925 105, 960 112, 990 128"
                    fill="none" stroke-width="13.6" stroke-linecap="round" />
              <path class="arm-tube" d="M672 105 H860 C925 105, 960 112, 990 128"
                    fill="none" stroke-width="12" stroke-linecap="round" />

              <!-- Headshell, set at the offset angle where the bend ends.
                   Nothing marks the stylus: it points straight down into the
                   record, so from directly above it is hidden under the front
                   of the head. That point, local (36, 24), is still what
                   main.js measures ARM_LEN and DRAWN_ANGLE from even though no
                   element sits on it. -->
              <g transform="translate(990 128) rotate(30)">
                <!-- collar over the tube joint -->
                <rect class="head-collar" x="-10" y="-8" width="20" height="16" rx="8" />
                <!-- Body. It grows forward and across, never backward: the rear
                     corner is what overhangs the record rim at the lead-in, so
                     x=2 is fixed and only the nose and the width move. -->
                <rect class="head-body" x="2" y="-12" width="46" height="24" rx="6" stroke-width="1.1" />
              </g>
            </g>

            <!-- fixed pivot base -->
            <circle class="arm-base" cx="640" cy="105" r="34" stroke-width="1" />
            <circle class="arm-cap" cx="640" cy="105" r="21" stroke-width="1.1" />
            <circle class="bearing-pin" cx="640" cy="105" r="4.2" />
          </svg>

          <!-- Compact hides the transport, so the deck itself becomes the one
               control. Inert at the full size, where the real buttons exist and
               a second way to play would be a third route to the same thing. -->
          <button id="deckHit" type="button" aria-label="Play"></button>
        </div>

        <!-- ─── right column ─── -->
        <div class="side">
          <!-- The reference fills this with lyrics; PLAN.md defers lyrics and
               we have no source for them, so it carries what we do have. -->
          <div class="screen">
            <!-- Rides to the top when there are lyrics to make room for, and
                 settles back into the middle of the screen when there are not.
                 The album travels with it, which is why it lives in here. -->
            <div class="screen-head">
              <div class="title" id="uiTitle">No session</div>
              <div class="artist" id="uiArtist">Nothing is playing</div>
              <!-- The source app is still read, since label.js seeds the
                   procedural label from it, but "msedge.exe" is plumbing and
                   not worth screen space. -->
              <div class="meta" id="uiMeta">
                <div class="album" id="uiAlbum"></div>
              </div>

              <div class="note-ic" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M13.2 3.6 20 2v3.3l-5.2 1.3v9.1a3.2 3.2 0 1 1-1.6-2.77Z" />
                </svg>
              </div>
            </div>

            <!-- Timed lyrics, scrolling against the real playback position.
                 The inner track is what moves: one transform per line, on the
                 compositor, rather than a scroll written every frame. -->
            <div class="lyrics" id="uiLyrics" aria-hidden="true">
              <div class="lyric-track" id="uiLyricTrack"></div>
            </div>
          </div>

          <!-- A readout, not a control: PLAN.md excludes seek, so it must not
               look grabbable. -->
          <div class="seekrow">
            <div class="bar"><i id="uiBar"></i></div>
          </div>
          <div class="times">
            <span id="uiElapsed">0:00</span><span id="uiTotal">–:––</span>
          </div>

          <!-- Every control is real, and disabled unless the source reports it
               supported, so nothing offers what it cannot do. -->
          <div class="controls">
            <button class="tbtn" id="btnPrev" type="button" aria-label="Previous track">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M11.6 12 21 6.2v11.6ZM2.6 12 12 6.2v11.6Z" />
              </svg>
            </button>

            <button class="big" id="btnPlay" type="button" aria-label="Play">
              <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="6.2" y="4.8" width="4.1" height="14.4" rx="1.2" />
                <rect x="13.7" y="4.8" width="4.1" height="14.4" rx="1.2" />
              </svg>
              <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5.1v13.8L19.4 12Z" />
              </svg>
            </button>

            <button class="tbtn" id="btnNext" type="button" aria-label="Next track">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M3 6.2 12.4 12 3 17.8ZM12.4 6.2 21.8 12l-9.4 5.8Z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
