<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vinyl</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>

  <body>
    <!--
      Every colour in this SVG comes from a CSS class, never a fill attribute.
      Chromium does not resolve var() inside SVG presentation attributes, so
      fill="var(--x)" fails silently; styling by class is what makes the two
      palettes possible at all.
    -->
    <div class="vinyl-widget" id="widget" role="group" aria-label="Now playing">
      <!-- ─── deck: the platter in a machined recess ─── -->
      <div class="deck">
        <svg
          viewBox="0 0 232 232"
          preserveAspectRatio="xMidYMid meet"
          aria-hidden="true"
        >
          <defs>
            <radialGradient id="gPlatter" cx="42%" cy="34%" r="68%">
              <stop offset="0" class="s-platter-hi" />
              <stop offset="0.5" class="s-platter-mid" />
              <stop offset="1" class="s-platter-lo" />
            </radialGradient>
            <linearGradient
              id="gTube"
              gradientUnits="userSpaceOnUse"
              x1="195.25"
              y1="0"
              x2="200.75"
              y2="0"
            >
              <stop offset="0" class="s-metal-lo" />
              <stop offset="0.3" class="s-metal-hi" />
              <stop offset="0.55" class="s-metal-mid" />
              <stop offset="1" class="s-metal-lo" />
            </linearGradient>
            <radialGradient id="gCap" cx="36%" cy="30%" r="78%">
              <stop offset="0" class="s-metal-hi" />
              <stop offset="0.55" class="s-metal-mid" />
              <stop offset="1" class="s-metal-lo" />
            </radialGradient>
            <radialGradient id="gCw" cx="38%" cy="30%" r="80%">
              <stop offset="0" class="s-metal-hi" />
              <stop offset="0.6" class="s-metal-mid" />
              <stop offset="1" class="s-metal-lo" />
            </radialGradient>
            <linearGradient id="gWell" x1="0" y1="0" x2="0.3" y2="1">
              <stop offset="0" class="s-well-hi" />
              <stop offset="1" class="s-well-lo" />
            </linearGradient>
            <radialGradient id="gBolt" cx="35%" cy="30%" r="75%">
              <stop offset="0" class="s-metal-hi" />
              <stop offset="1" class="s-metal-lo" />
            </radialGradient>
            <radialGradient id="gLabShade" cx="42%" cy="34%" r="72%">
              <stop offset="0" stop-color="rgba(255,255,255,.10)" />
              <stop offset="0.45" stop-color="rgba(255,255,255,0)" />
              <stop offset="1" stop-color="rgba(0,0,0,.34)" />
            </radialGradient>
            <filter id="fB7" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="7" />
            </filter>
            <filter id="fB5" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="5" />
            </filter>
            <filter id="fB2" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="1.4" />
            </filter>
            <mask id="mV">
              <rect x="0" y="0" width="232" height="232" fill="#000" />
              <circle cx="96" cy="112" r="76" fill="#fff" />
            </mask>
            <clipPath id="cLab">
              <circle cx="96" cy="112" r="26" />
            </clipPath>
          </defs>

          <!-- Recessed well: the platter sits in a machined pocket rather than
               on a flat face, with bolt heads at its left corners. -->
          <rect class="well-edge" x="6" y="12" width="220" height="208" rx="12" />
          <rect class="well-face" x="8" y="14" width="216" height="204" rx="10.5" fill="url(#gWell)" />
          <rect class="well-rim" x="8" y="14" width="216" height="204" rx="10.5" fill="none" stroke-width="1" />

          <circle class="bolt-shadow" cx="22" cy="30" r="6.4" />
          <circle class="bolt-face" cx="22" cy="29.4" r="5.6" fill="url(#gBolt)" stroke-width=".7" />
          <path class="bolt-slot" d="M18.6 29.4 H25.4" stroke-width="1.1" />
          <circle class="bolt-shadow" cx="22" cy="202" r="6.4" />
          <circle class="bolt-face" cx="22" cy="201.4" r="5.6" fill="url(#gBolt)" stroke-width=".7" />
          <path class="bolt-slot" d="M18.6 201.4 H25.4" stroke-width="1.1" />

          <!-- platter -->
          <circle cx="96" cy="117" r="90" fill="#000" opacity=".45" filter="url(#fB5)" />
          <circle class="platter-well" cx="96" cy="112" r="92" />
          <circle class="platter-face" cx="96" cy="112" r="88" fill="url(#gPlatter)" stroke-width="1" />
          <circle class="strobe" cx="96" cy="112" r="84" fill="none" opacity=".85"
                  stroke-width="2" stroke-dasharray="1.15 3.8" />
          <circle class="mat" cx="96" cy="112" r="80" />
          <g class="mat-ring" fill="none" stroke-width=".7">
            <circle cx="96" cy="112" r="34" />
            <circle cx="96" cy="112" r="49" />
            <circle cx="96" cy="112" r="63" />
            <circle cx="96" cy="112" r="74" />
          </g>
          <circle class="spindle-hole" cx="96" cy="112" r="3.2" />

          <!-- ─── the record ─── -->
          <g id="vinylG">
            <g id="spinG">
              <circle class="vinyl" cx="96" cy="112" r="76" />
              <circle cx="96" cy="112" r="76" fill="none" stroke="#000" stroke-width="1" />
              <g id="grooves" fill="none"></g>
              <path class="seam" d="M 96 36.4 L 96 41.4" stroke-width=".8" opacity=".8" />
              <g id="labelG"></g>
            </g>
            <g mask="url(#mV)" pointer-events="none">
              <path class="sheen-a" d="M96 112 L10 0 L140 -22 Z" opacity=".13" filter="url(#fB7)" />
              <path class="sheen-b" d="M96 112 L190 224 L96 244 Z" opacity=".075" filter="url(#fB7)" />
            </g>
            <circle cx="96" cy="112" r="2.2" fill="url(#gCap)" stroke="rgba(0,0,0,.6)" stroke-width=".4" />
          </g>

          <!-- ─── tonearm ─── -->
          <g id="armRest">
            <ellipse cx="198" cy="122.5" rx="6.5" ry="2" fill="#000" opacity=".4" filter="url(#fB2)" />
            <rect class="rest" x="193.2" y="117.4" width="9.6" height="5.2" rx="2.4" stroke-width=".6" />
          </g>

          <g id="cue" cursor="pointer">
            <rect class="slot" x="212.5" y="96" width="10" height="27" rx="5" />
            <rect class="well-rim" x="212.5" y="96" width="10" height="27" rx="5" fill="none" stroke-width=".7" />
            <g id="cueKnob">
              <rect class="metal-edge" x="208.4" y="110.5" width="18.2" height="9.6" rx="3"
                    fill="url(#gCw)" stroke-width=".8" />
              <rect x="208.4" y="110.5" width="18.2" height="3.2" rx="1.6" fill="rgba(255,255,255,.16)" />
              <path d="M210.8 115.4 H224.2 M210.8 117.4 H224.2" stroke="rgba(0,0,0,.34)" stroke-width=".6" />
            </g>
            <rect x="203" y="92" width="28" height="36" fill="transparent" />
          </g>

          <g id="armBase">
            <circle class="arm-base" cx="198" cy="42" r="13.5" stroke-width="1" />
          </g>

          <g id="armG" transform="rotate(0 198 42)">
            <line x1="198" y1="26" x2="198" y2="43" stroke="rgba(0,0,0,.45)" stroke-width="4.8" />
            <line x1="198" y1="26" x2="198" y2="43" stroke="url(#gTube)" stroke-width="3.2" />

            <rect class="metal-edge" x="192.4" y="14.5" width="11.2" height="17" rx="5.6"
                  fill="url(#gCw)" stroke-width=".8" />
            <path d="M193.8 21.5 H202.2 M193.6 24 H202.4 M193.8 26.5 H202.2"
                  stroke="rgba(0,0,0,.26)" stroke-width=".55" />

            <circle class="metal-edge" cx="198" cy="42" r="6" fill="url(#gCap)" stroke-width=".8" />
            <circle class="bearing-pin" cx="198" cy="42" r="1" />

            <line x1="198" y1="47" x2="198" y2="124" stroke="rgba(0,0,0,.4)" stroke-width="7.2" stroke-linecap="round" />
            <line x1="198" y1="47" x2="198" y2="124" stroke="url(#gTube)" stroke-width="5.5" stroke-linecap="round" />
            <line x1="196.5" y1="49" x2="196.5" y2="122" stroke="rgba(255,255,255,.55)" stroke-width=".8"
                  stroke-linecap="round" opacity=".5" />

            <g transform="rotate(21 198 124)">
              <path class="shell" d="M193.8 123 h8.4 l1 12.6 a3.4 3.4 0 0 1 -3.4 3.7 h-3.6 a3.4 3.4 0 0 1 -3.4 -3.7 Z"
                    stroke-width=".8" />
              <path class="shell-top" d="M193.8 123 h8.4 l.2 2.8 h-8.8 Z" />
              <!-- The stylus is deliberately not drawn: it points down into the
                   record, so from directly above it sits beneath the cartridge. -->
              <rect class="cart" x="195.3" y="130.6" width="5.4" height="6.8" rx="1.1" stroke-width=".5" />
              <rect class="metal-mid-fill" x="196" y="131.5" width="4" height="1.3" rx=".65" opacity=".7" />
              <path class="metal-mid-fill" d="M202 127 h5.4 a1.5 1.5 0 0 1 0 3 h-5.4 z" />
              <path class="metal-hi-fill" d="M202 127 h5.4 a1.5 1.5 0 0 1 .6 .5 h-6 z" opacity=".8" />
              <ellipse id="needleSh" cx="197.9" cy="138.8" rx="3" ry=".9" fill="#000" opacity="0" filter="url(#fB2)" />
            </g>
          </g>
        </svg>
      </div>

      <!-- ─── panel ─── -->
      <div class="panel">
        <div class="header">
          <span class="lamp" id="uiLamp" aria-hidden="true"></span>
          <span class="header-text">Now Playing</span>
          <span class="header-dot" aria-hidden="true"></span>
        </div>

        <!-- The screen. The reference fills this with lyrics; PLAN.md defers
             lyrics, so it carries what we actually have: the track, and a
             waveform whose lit portion is the real playback position. -->
        <div class="screen">
          <div class="screen-inner">
            <svg class="note" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
              <path d="M21 3v13.5a3.5 3.5 0 1 1-2-3.16V6.9l-9 1.8v9.8a3.5 3.5 0 1 1-2-3.16V5.2l13-2.2z" />
            </svg>

            <div class="now">
              <div class="title" id="uiTitle">No session</div>
              <div class="artist" id="uiArtist">Nothing is playing</div>
              <div class="album" id="uiAlbum"></div>
              <div class="source" id="uiSource"></div>
            </div>

            <!-- Deterministic per track, and the lit portion is real progress,
                 so it is a readout rather than decoration. Real audio-reactive
                 bars need the peak metering in Phase 6. -->
            <div class="wave" aria-hidden="true">
              <div class="wave-row" id="uiWaveDim"></div>
              <div class="wave-row wave-lit" id="uiWaveLit"></div>
            </div>
          </div>
        </div>

        <div class="progress">
          <span class="time" id="uiElapsed">0:00</span>
          <div class="bar">
            <i id="uiBar"></i>
            <span class="knob" id="uiKnob"></span>
          </div>
          <span class="time" id="uiTotal">–:––</span>
        </div>

        <!-- Every control here is real. Each is disabled unless the source
             reports it supported, so nothing offers what it cannot do. -->
        <div class="controls">
          <button id="btnShuffle" class="ghost" type="button" aria-label="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 3h5v5" /><path d="M4 20 21 3" /><path d="M21 16v5h-5" />
              <path d="m15 15 6 6" /><path d="M4 4l5 5" />
            </svg>
          </button>

          <button id="btnPrev" class="ghost" type="button" aria-label="Previous track">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 20 9 12l10-8z" /><path d="M5 19V5" />
            </svg>
          </button>

          <button id="btnPlay" class="playpause" type="button" aria-label="Play">
            <svg id="icPlay" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <!-- The glyph's own bounding box is centred at x 14.81 against a
                   viewBox centre of 12, so it needs shifting to sit true. -->
              <path
                transform="translate(-2.81 0)"
                d="M8.6 5.5v13c0 .96 1.06 1.54 1.86 1.02l10-6.5c.74-.48.74-1.56 0-2.04l-10-6.5C9.66 3.96 8.6 4.54 8.6 5.5z"
              />
            </svg>
            <svg id="icPause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M7.4 5h3.1v14H7.4zM13.5 5h3.1v14h-3.1z" />
            </svg>
          </button>

          <button id="btnNext" class="ghost" type="button" aria-label="Next track">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m5 4 10 8-10 8z" /><path d="M19 5v14" />
            </svg>
          </button>

          <button id="btnRepeat" class="ghost" type="button" aria-label="Repeat" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m17 2 4 4-4 4" /><path d="M3 11v-1a4 4 0 0 1 4-4h14" />
              <path d="m7 22-4-4 4-4" /><path d="M21 13v1a4 4 0 0 1-4 4H3" />
            </svg>
            <span class="badge" id="uiRepeatOne" aria-hidden="true">1</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
