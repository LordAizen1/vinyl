<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vinyl</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>

  <body>
    <!--
      Geometry and proportions follow the supplied silver reference build.
      What differs is the engine: the platter runs as one composited animation
      and the arm on a transition, rather than a rAF loop writing SVG
      transforms every frame. See CLAUDE.md constraint 4.

      Every colour comes from a CSS class, never a fill attribute: Chromium
      does not resolve var() inside SVG presentation attributes, so
      fill="var(--x)" fails silently and theming would break.
    -->
    <div class="widget" id="widget">
      <div class="face">
        <!-- ─── the plate: a raised panel, record straight onto it ─── -->
        <div class="plate">
          <svg viewBox="0 0 715 700" aria-hidden="true">
            <defs>
              <radialGradient id="gVinyl" cx="46%" cy="42%" r="65%">
                <stop offset="0" class="s-vinyl-hi" />
                <stop offset=".45" class="s-vinyl-mid" />
                <stop offset=".78" class="s-vinyl-lo" />
                <stop offset="1" class="s-vinyl-edge" />
              </radialGradient>
              <radialGradient id="gScrew" cx="35%" cy="30%" r="75%">
                <stop offset="0" class="s-metal-hi" />
                <stop offset=".45" class="s-metal-mid" />
                <stop offset=".8" class="s-metal-lo" />
                <stop offset="1" class="s-metal-deep" />
              </radialGradient>
              <radialGradient id="gBase" cx="36%" cy="30%" r="80%">
                <stop offset="0" class="s-metal-hi" />
                <stop offset=".5" class="s-metal-mid" />
                <stop offset=".85" class="s-metal-lo" />
                <stop offset="1" class="s-metal-deep" />
              </radialGradient>
              <radialGradient id="gCapIn" cx="40%" cy="32%" r="80%">
                <stop offset="0" class="s-metal-hi" />
                <stop offset=".6" class="s-metal-lo" />
                <stop offset="1" class="s-metal-deep" />
              </radialGradient>
              <linearGradient id="gTube" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" class="s-metal-hi" />
                <stop offset=".45" class="s-metal-mid" />
                <stop offset="1" class="s-metal-deep" />
              </linearGradient>
              <linearGradient id="gHead" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" class="s-head-hi" />
                <stop offset=".5" class="s-head-mid" />
                <stop offset="1" class="s-head-lo" />
              </linearGradient>
              <radialGradient id="gCw" cx="35%" cy="30%" r="80%">
                <stop offset="0" class="s-metal-mid" />
                <stop offset=".6" class="s-metal-lo" />
                <stop offset="1" class="s-metal-deep" />
              </radialGradient>
              <radialGradient id="gSpin" cx="35%" cy="30%" r="80%">
                <stop offset="0" class="s-metal-hi" />
                <stop offset=".55" class="s-metal-mid" />
                <stop offset="1" class="s-metal-lo" />
              </radialGradient>
              <radialGradient id="gLabShade" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#fff" stop-opacity=".10" />
                <stop offset=".62" stop-color="#000" stop-opacity="0" />
                <stop offset="1" stop-color="#000" stop-opacity=".28" />
              </radialGradient>
              <linearGradient id="gSheen" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity=".13" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
              <filter id="fB16" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="16" />
              </filter>
              <filter id="fB8" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="8" />
              </filter>
              <filter id="fB4" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="4" />
              </filter>
              <clipPath id="cLab"><circle cx="335" cy="345" r="92" /></clipPath>
              <clipPath id="cRec"><circle cx="335" cy="345" r="303" /></clipPath>
            </defs>

            <!-- corner screws -->
            <ellipse cx="63" cy="70" rx="23" ry="21" fill="#000" opacity=".18" filter="url(#fB4)" />
            <circle cx="60" cy="65" r="22" fill="url(#gScrew)" />
            <circle class="screw-edge" cx="60" cy="65" r="22" fill="none" stroke-width="1" />
            <circle class="screw-inner" cx="60" cy="65" r="12.5" fill="none" stroke-width="1.6" />
            <ellipse cx="43" cy="630" rx="23" ry="21" fill="#000" opacity=".18" filter="url(#fB4)" />
            <circle cx="40" cy="625" r="22" fill="url(#gScrew)" />
            <circle class="screw-edge" cx="40" cy="625" r="22" fill="none" stroke-width="1" />
            <circle class="screw-inner" cx="40" cy="625" r="12.5" fill="none" stroke-width="1.6" />

            <!-- arm rest, where the arm parks when nothing is playing -->
            <ellipse cx="643" cy="500" rx="26" ry="15" fill="#000" opacity=".16" filter="url(#fB4)" />
            <rect class="rest" x="620" y="480" width="44" height="24" rx="12" stroke-width="1.4" />

            <circle cx="345" cy="361" r="303" fill="#000" opacity=".32" filter="url(#fB16)" />

            <!-- ─── the record ─── -->
            <g id="vinylG">
              <circle cx="335" cy="345" r="303" fill="url(#gVinyl)" />
              <g id="spinG">
                <g id="grooves"></g>
                <g id="labelG"></g>
              </g>

              <!-- Fixed-light sheen above the rotating surface: the grooves
                   turn beneath it, which is what real vinyl does. -->
              <g clip-path="url(#cRec)" opacity=".55">
                <path d="M335 345 L95 105 A339 339 0 0 1 260 22 Z" fill="url(#gSheen)" filter="url(#fB8)" />
                <path d="M335 345 L575 585 A339 339 0 0 1 410 668 Z" fill="url(#gSheen)" filter="url(#fB8)" opacity=".7" />
              </g>
              <circle cx="335" cy="345" r="301.5" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.7" />

              <circle cx="335" cy="345" r="14" fill="url(#gSpin)" />
              <circle cx="335" cy="345" r="14" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1" />
              <circle class="spindle-pin" cx="335" cy="345" r="5.4" />
              <circle cx="331.6" cy="341.4" r="1.8" fill="#fff" opacity=".85" />
            </g>

            <!-- ─── tonearm ─── -->
            <g clip-path="url(#cRec)">
              <path
                id="armSh"
                d="M672 105 H860 C925 105, 960 112, 990 128"
                transform="translate(7 12) rotate(80.2 640 105)"
                fill="none"
                stroke="#000"
                stroke-width="14"
                stroke-linecap="round"
                opacity=".3"
                filter="url(#fB8)"
              />
            </g>

            <g id="armG" transform="rotate(80.2 640 105)">
              <circle cx="582" cy="105" r="13.5" fill="url(#gCw)" />
              <circle cx="582" cy="105" r="13.5" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1" />
              <rect x="588" y="97.5" width="28" height="15" rx="7.5" fill="url(#gTube)" />

              <!-- Straight tube, then the bend. A J-arm: the tube runs true out
                   of the bearing and only turns near the headshell. -->
              <path d="M672 105 H860 C925 105, 960 112, 990 128" fill="none"
                    stroke="url(#gTube)" stroke-width="12" stroke-linecap="round" />
              <path d="M674 101.4 H858 C922 101.4, 956 108.6, 985 124.4" fill="none"
                    stroke="rgba(255,255,255,.6)" stroke-width="2.6" stroke-linecap="round" opacity=".8" />

              <!-- Headshell, set at the offset angle where the bend ends. The
                   stylus itself is not drawn: it points down into the record,
                   so from directly above it sits beneath the cartridge. The
                   contact point it implies is what main.js measures ARM_LEN
                   and DRAWN_ANGLE from. -->
              <g transform="translate(990 128) rotate(30)">
                <!-- collar over the tube joint -->
                <rect class="head-collar" x="-9" y="-6.5" width="18" height="13" rx="6.5" />
                <!-- body -->
                <rect x="2" y="-9.5" width="46" height="19" rx="5" fill="url(#gHead)"
                      stroke="#0c0d0f" stroke-width=".9" />
                <rect x="6" y="-7.4" width="38" height="3.2" rx="1.6" fill="rgba(255,255,255,.38)" />
                <!-- finger lift on the nose -->
                <path d="M48 -9.5 l10 5 -10 5 z" fill="url(#gHead)" stroke="#0c0d0f" stroke-width=".8" />
                <!-- cartridge, slung under the front of the headshell -->
                <rect class="cart" x="26" y="9" width="21" height="11" rx="2.5" />
                <rect x="29" y="11" width="15" height="2.4" rx="1.2" fill="rgba(255,255,255,.22)" />
              </g>
            </g>

            <!-- fixed pivot base -->
            <ellipse cx="646" cy="115" rx="37" ry="34" fill="#000" opacity=".22" filter="url(#fB8)" />
            <circle cx="640" cy="105" r="34" fill="url(#gBase)" />
            <path d="M609 96 A 34 34 0 0 1 671 96" fill="none" stroke="rgba(255,255,255,.75)"
                  stroke-width="2.4" stroke-linecap="round" />
            <circle cx="640" cy="105" r="21" fill="url(#gCapIn)" />
            <circle cx="640" cy="105" r="21" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="1.1" />
            <circle class="bearing-pin" cx="640" cy="105" r="4.2" />

            <!-- Cue lever. On a real deck this is the pause: it raises the arm
                 hydraulically while the platter keeps turning. Deliberately a
                 lever, not a knob: a second round chrome shape beside the
                 bearing just reads as a second counterweight. -->
            <g id="cue" cursor="pointer">
              <rect class="slot" x="681" y="70" width="26" height="74" rx="13" />
              <rect class="slot-rim" x="681" y="70" width="26" height="74" rx="13" fill="none" stroke-width="1.4" />
              <g id="cueKnob">
                <rect x="674" y="108" width="40" height="26" rx="8" fill="url(#gCw)"
                      stroke="rgba(0,0,0,.35)" stroke-width="1" />
                <rect x="674" y="108" width="40" height="9" rx="4.5" fill="rgba(255,255,255,.4)" />
                <path d="M681 122 H707 M681 128 H707" stroke="rgba(0,0,0,.3)" stroke-width="1.6" />
              </g>
              <rect x="668" y="60" width="52" height="96" fill="transparent" />
            </g>
          </svg>
        </div>

        <!-- ─── right column ─── -->
        <div class="side">
          <div class="np">
            <i class="lamp" id="uiLamp"></i>Now&nbsp;Playing<i class="lamp"></i>
          </div>

          <!-- The reference fills this with lyrics; PLAN.md defers lyrics and
               we have no source for them, so it carries what we do have. -->
          <div class="screen">
            <div class="screen-body">
              <div class="title" id="uiTitle">No session</div>
              <div class="artist" id="uiArtist">Nothing is playing</div>
              <div class="album" id="uiAlbum"></div>
              <div class="source" id="uiSource"></div>
            </div>

            <div class="note-ic" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.2 3.6 20 2v3.3l-5.2 1.3v9.1a3.2 3.2 0 1 1-1.6-2.77Z" />
              </svg>
            </div>

            <!-- Deterministic per track, lit to the real playback position, so
                 it is a readout rather than decoration. Audio-reactive bars
                 need the peak metering in Phase 6. -->
            <div class="wave" aria-hidden="true">
              <div class="wave-row" id="uiWaveDim"></div>
              <div class="wave-row wave-lit" id="uiWaveLit"></div>
            </div>
          </div>

          <!-- A readout, not a control: PLAN.md excludes seek, so it must not
               look grabbable. -->
          <div class="seekrow">
            <div class="bar"><i id="uiBar"></i><span class="knob" id="uiKnob"></span></div>
          </div>
          <div class="times">
            <span id="uiElapsed">0:00</span><span id="uiTotal">–:––</span>
          </div>

          <!-- Every control is real, and disabled unless the source reports it
               supported, so nothing offers what it cannot do. -->
          <div class="controls">
            <button class="tbtn mode" id="btnShuffle" type="button" aria-pressed="false" aria-label="Shuffle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 7h3.3c5.6 0 7.8 10 13.4 10H20" />
                <path d="M2 17h3.3c2.4 0 4.1-1.8 5.5-3.9" />
                <path d="M13.2 10.9C14.6 8.8 16.3 7 18.7 7H20" />
                <path d="m18 3.6 3.4 3.4L18 10.4" />
                <path d="m18 13.6 3.4 3.4L18 20.4" />
              </svg>
            </button>

            <button class="tbtn" id="btnPrev" type="button" aria-label="Previous track">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M11.6 12 21 6.2v11.6ZM2.6 12 12 6.2v11.6Z" />
              </svg>
            </button>

            <button class="big" id="btnPlay" type="button" aria-label="Play">
              <svg id="icPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="6.2" y="4.8" width="4.1" height="14.4" rx="1.2" />
                <rect x="13.7" y="4.8" width="4.1" height="14.4" rx="1.2" />
              </svg>
              <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5.1v13.8L19.4 12Z" />
              </svg>
            </button>

            <button class="tbtn" id="btnNext" type="button" aria-label="Next track">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M3 6.2 12.4 12 3 17.8ZM12.4 6.2 21.8 12l-9.4 5.8Z" />
              </svg>
            </button>

            <button class="tbtn mode" id="btnRepeat" type="button" aria-pressed="false" aria-label="Repeat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 9V8a4 4 0 0 0-4-4H5.6" />
                <path d="m8.4 1.6-3.4 2.4 3.4 2.4" />
                <path d="M4 15v1a4 4 0 0 0 4 4h10.4" />
                <path d="m15.6 22.4 3.4-2.4-3.4-2.4" />
              </svg>
              <span class="badge" id="uiRepeatOne" aria-hidden="true">1</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
